<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p class="text-xl text-gray-600">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration - PERMANENT GOOGLE SHEET LINK
        const SHEET_ID = '1T8p2ojn8W6jmC5rTAcZ7xxE7MKy-n9fa5ke4QFzVQY4';
        const GID = '931447490';

        let allTickets = [];
        let filteredTickets = [];
        let filters = {
            mrfNo: '',
            villa: '',
            system: '',
            status: ''
        };
        let chatHistory = [];
        let showChat = false;
        let isListening = false;
        let recognition = null;
        let synthesis = window.speechSynthesis;

        // Parse CSV
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const tickets = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim().replace(/^"|"$/g, ''));
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim().replace(/^"|"$/g, ''));
                
                if (values[2] && values[2].trim()) {
                    tickets.push({
                        date: values[0] || '',
                        time: values[1] || '',
                        mrfNo: values[2] || '',
                        villa: values[3] || '',
                        system: values[4] || '',
                        receptionist: values[5] || '',
                        details: values[6] || '',
                        intimatedBy: values[7] || '',
                        actionTaker: values[8] || '',
                        actionDate: values[9] || '',
                        status: values[10] || 'Pending'
                    });
                }
            }
            
            return tickets;
        }

        // Load data from Google Sheets
        async function loadData() {
            try {
                console.log('Loading data...');
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
                const response = await fetch(url);
                const text = await response.text();
                
                console.log('Data loaded, parsing...');
                allTickets = parseCSV(text);
                console.log('Tickets found:', allTickets.length);
                
                applyFilters();
                render();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-6">
                        <div class="bg-red-50 border-l-4 border-red-500 p-6 max-w-2xl">
                            <h2 class="text-xl font-bold text-red-800 mb-2">Error Loading Data</h2>
                            <p class="text-red-700 mb-4">${error.message}</p>
                            <div class="text-sm text-red-600">
                                <p class="font-semibold mb-2">Please check:</p>
                                <ol class="list-decimal ml-5 space-y-1">
                                    <li>Your Google Sheet is shared as "Anyone with the link can view"</li>
                                    <li>The sheet ID is correct: ${SHEET_ID}</li>
                                    <li>The GID (tab ID) is correct: ${GID}</li>
                                </ol>
                            </div>
                            <button onclick="loadData()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                                Try Again
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // Apply filters
        function applyFilters() {
            filteredTickets = allTickets.filter(ticket => {
                // Exact match for villa if filter is set, otherwise show all
                const villaMatch = !filters.villa || ticket.villa.toLowerCase() === filters.villa.toLowerCase();
                
                return (
                    villaMatch &&
                    (!filters.mrfNo || ticket.mrfNo.toLowerCase().includes(filters.mrfNo.toLowerCase())) &&
                    (!filters.system || ticket.system.toLowerCase().includes(filters.system.toLowerCase())) &&
                    (!filters.status || ticket.status.toLowerCase().includes(filters.status.toLowerCase()))
                );
            });
        }

        // Update filter
        function updateFilter(key, value) {
            filters[key] = value;
            applyFilters();
            render();
        }

        // Clear all filters and return to dashboard
        function resetDashboard() {
            filters = {
                mrfNo: '',
                villa: '',
                system: '',
                status: ''
            };
            applyFilters();
            render();
        }

        // Toggle chat window
        function toggleChat() {
            showChat = !showChat;
            
            // Initialize speech recognition on first open
            if (showChat && !recognition) {
                initSpeechRecognition();
            }
            
            render();
        }

        // Initialize Speech Recognition
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                console.log('Speech recognition not supported');
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                isListening = true;
                render();
            };
            
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('chatInput').value = transcript;
                isListening = false;
                render();
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                isListening = false;
                render();
            };
            
            recognition.onend = () => {
                isListening = false;
                render();
            };
        }

        // Start voice input
        function startVoiceInput() {
            if (!recognition) {
                alert('Speech recognition is not supported in your browser. Please use Chrome, Edge, or Safari.');
                return;
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Speak the response
        function speakText(text) {
            // Cancel any ongoing speech
            synthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            synthesis.speak(utterance);
        }

        // Stop speaking
        function stopSpeaking() {
            synthesis.cancel();
        }

        // Send chat message
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const question = input.value.trim();
            
            if (!question) return;
            
            // Add user message to chat
            chatHistory.push({ role: 'user', content: question });
            input.value = '';
            render();
            
            try {
                // Prepare data summary for AI
                const dataSummary = {
                    totalTickets: allTickets.length,
                    systems: [...new Set(allTickets.map(t => t.system))],
                    villas: [...new Set(allTickets.map(t => t.villa))],
                    recentTickets: allTickets.slice(-50) // Last 50 tickets for context
                };
                
                const systemPrompt = `You are a helpful AI assistant for a villa maintenance dashboard. You have access to maintenance ticket data. 
                
Current data summary:
- Total tickets: ${dataSummary.totalTickets}
- Systems: ${dataSummary.systems.join(', ')}
- Villas: ${dataSummary.villas.join(', ')}

Answer questions about maintenance tickets, complaints, statistics, and trends. Be concise and helpful.`;

                const userPrompt = `Based on this maintenance data, please answer: ${question}

Here's a sample of recent tickets:
${JSON.stringify(dataSummary.recentTickets.slice(0, 10), null, 2)}

Full ticket data context: ${allTickets.length} total tickets across all villas and systems.`;

                // Call Claude AI API
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        system: systemPrompt,
                        messages: [
                            ...chatHistory.filter(m => m.role !== 'user' || m.content !== question).map(m => ({
                                role: m.role,
                                content: m.content
                            })),
                            { role: 'user', content: userPrompt }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.content && data.content[0]) {
                    const answer = data.content[0].text;
                    chatHistory.push({ role: 'assistant', content: answer });
                    speakText(answer); // Auto-speak AI response
                } else {
                    throw new Error('Invalid response from AI');
                }
                
            } catch (error) {
                console.error('Chat error:', error);
                
                // Fallback: Simple rule-based answers
                const answer = getSimpleAnswer(question);
                chatHistory.push({ role: 'assistant', content: answer });
                speakText(answer); // Auto-speak response
            }
            
            render();
        }

        // Simple rule-based fallback answers
        function getSimpleAnswer(question) {
            const q = question.toLowerCase();
            
            // Parse dates - check for yesterday, today, last week, etc.
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            function parseTicketDate(dateStr) {
                // Handle formats like "29-November-2025" or "6-July-2025"
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const months = {
                        'january': 0, 'february': 1, 'march': 2, 'april': 3, 'may': 4, 'june': 5,
                        'july': 6, 'august': 7, 'september': 8, 'october': 9, 'november': 10, 'december': 11
                    };
                    const day = parseInt(parts[0]);
                    const month = months[parts[1].toLowerCase()];
                    const year = parseInt(parts[2]);
                    return new Date(year, month, day);
                }
                return null;
            }
            
            // Extract villa/flat number from question - improved to match both
            const villaMatch = q.match(/villa\s*(\d+)/i);
            const flatMatch = q.match(/flat\s*(\d+)/i);
            let villa = null;
            
            if (villaMatch) {
                villa = `Villa ${villaMatch[1]}`;
            } else if (flatMatch) {
                villa = `Flat ${flatMatch[1]}`;
            }
            
            // Extract system from question
            const systems = ['ac', 'electrical', 'plumbing', 'carpentry', 'painting', 'mason'];
            const system = systems.find(s => q.includes(s));
            
            // Search in complaint details for specific items/issues
            function searchInDetails(keywords, exactPhrase = false) {
                return allTickets.filter(t => {
                    const details = t.details.toLowerCase();
                    if (exactPhrase) {
                        // For phrases like "interlock paint", look for the complete phrase
                        return keywords.some(keyword => details.includes(keyword.toLowerCase()));
                    }
                    return keywords.some(keyword => details.includes(keyword.toLowerCase()));
                });
            }
            
            // Check if question is about specific items in details
            // Order matters - more specific terms first!
            const detailKeywords = {
                'interlock paint': ['interlock paint', 'interlock need to paint', 'interlock painting'],
                'interlock': ['interlock'],
                'door lock': ['door lock', 'door locker'],
                'washing machine': ['washing machine', 'washer'],
                'dishwasher': ['dishwasher', 'dish washer'],
                'fridge': ['fridge', 'refrigerator'],
                'microwave': ['microwave', 'micro wave'],
                'oven': ['oven'],
                'water heater': ['water heater', 'heater', 'geyser'],
                'sink': ['sink', 'basin'],
                'toilet': ['toilet', 'wc', 'commode'],
                'shower': ['shower'],
                'tap': ['tap', 'faucet'],
                'door': ['door'],
                'window': ['window'],
                'lock': ['lock', 'locker'],
                'paint': ['paint', 'painting'],
                'tile': ['tile', 'tiles'],
                'ceiling': ['ceiling'],
                'wall': ['wall'],
                'floor': ['floor'],
                'light': ['light', 'bulb', 'lamp'],
                'fan': ['fan'],
                'switch': ['switch', 'socket'],
                'drain': ['drain', 'drainage', 'clogged', 'blocked'],
                'leak': ['leak', 'leaking', 'leakage'],
                'noise': ['noise', 'noisy', 'sound'],
                'smell': ['smell', 'odor', 'odour'],
                'crack': ['crack', 'cracked'],
                'damage': ['damage', 'damaged', 'broken'],
                'kitchen': ['kitchen'],
                'bathroom': ['bathroom'],
                'bedroom': ['bedroom'],
                'living room': ['living room', 'living-room'],
                'balcony': ['balcony']
            };
            
            // Find if question contains any detail keywords (check longer phrases first)
            let foundDetailKeyword = null;
            let searchKeywords = [];
            let isExactPhrase = false;
            
            // Check for multi-word phrases first
            if (q.includes('interlock') && (q.includes('paint') || q.includes('painting'))) {
                foundDetailKeyword = 'interlock paint';
                searchKeywords = detailKeywords['interlock paint'];
                isExactPhrase = true;
            } else if (q.includes('door') && q.includes('lock')) {
                foundDetailKeyword = 'door lock';
                searchKeywords = detailKeywords['door lock'];
                isExactPhrase = true;
            } else if (q.includes('water') && q.includes('heater')) {
                foundDetailKeyword = 'water heater';
                searchKeywords = detailKeywords['water heater'];
                isExactPhrase = true;
            } else if (q.includes('washing') && q.includes('machine')) {
                foundDetailKeyword = 'washing machine';
                searchKeywords = detailKeywords['washing machine'];
                isExactPhrase = true;
            } else {
                // Check single words
                for (const [item, keywords] of Object.entries(detailKeywords)) {
                    if (keywords.some(kw => q.includes(kw))) {
                        foundDetailKeyword = item;
                        searchKeywords = keywords;
                        break;
                    }
                }
            }
            
            // Question: Search in details - "How many washing machine complaints?"
            if (foundDetailKeyword) {
                const filtered = searchInDetails(searchKeywords, isExactPhrase);
                
                if (filtered.length === 0) {
                    return `❌ No complaints found related to "${foundDetailKeyword}".`;
                }
                
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = filtered.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                // Get villas/flats with this issue
                const locations = {};
                filtered.forEach(t => {
                    locations[t.villa] = (locations[t.villa] || 0) + 1;
                });
                const sortedLocations = Object.entries(locations).sort((a, b) => b[1] - a[1]);
                
                // Get systems involved
                const systemsInvolved = {};
                filtered.forEach(t => {
                    systemsInvolved[t.system] = (systemsInvolved[t.system] || 0) + 1;
                });
                
                let response = `🔍 Search Results for "${foundDetailKeyword.toUpperCase()}":\n\n`;
                response += `📊 Total Complaints: ${filtered.length}\n`;
                response += `✅ Completed: ${completed}\n`;
                response += `⏳ Pending: ${pending}\n\n`;
                
                response += `🏠 Affected Locations (${sortedLocations.length}):\n`;
                response += sortedLocations.slice(0, 10).map(([loc, count], i) => 
                    `${i + 1}. ${loc}: ${count} complaint${count > 1 ? 's' : ''}`
                ).join('\n');
                
                if (sortedLocations.length > 10) {
                    response += `\n...and ${sortedLocations.length - 10} more locations`;
                }
                
                response += `\n\n🔧 Systems Involved:\n`;
                response += Object.entries(systemsInvolved).sort((a, b) => b[1] - a[1]).map(([sys, count]) => 
                    `• ${sys}: ${count}`
                ).join('\n');
                
                response += `\n\n📋 Recent Examples:\n`;
                response += filtered.slice(-5).map(t => 
                    `• ${t.villa} (${t.date}): ${t.details.substring(0, 80)}${t.details.length > 80 ? '...' : ''}`
                ).join('\n');
                
                return response;
            }
            
            // Question: "Which villa has most AC complaints?" or "Which villa have more time ac complaints?"
            if ((q.includes('which villa') || q.includes('what villa') || q.includes('which flat') || q.includes('what flat')) && (q.includes('most') || q.includes('more') || q.includes('many time'))) {
                let targetSystem = system;
                if (q.includes('ac')) targetSystem = 'ac';
                
                const villaCounts = {};
                allTickets.forEach(t => {
                    if (!targetSystem || t.system.toLowerCase().includes(targetSystem)) {
                        villaCounts[t.villa] = (villaCounts[t.villa] || 0) + 1;
                    }
                });
                
                const sorted = Object.entries(villaCounts).sort((a, b) => b[1] - a[1]);
                const top5 = sorted.slice(0, 5);
                
                if (top5.length > 0) {
                    return `📊 Top locations with most ${targetSystem || 'complaints'}:\n\n${top5.map((v, i) => `${i + 1}. ${v[0]}: ${v[1]} complaints`).join('\n')}\n\n${top5[0][0]} has the most with ${top5[0][1]} complaints.`;
                }
            }
            
            // Question: "Yesterday how many complaints for AC?"
            if (q.includes('yesterday')) {
                const yesterdayStr = yesterday.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).replace(/ /g, '-');
                const yesterdayTickets = allTickets.filter(t => {
                    const ticketDate = parseTicketDate(t.date);
                    return ticketDate && ticketDate.toDateString() === yesterday.toDateString();
                });
                
                if (system) {
                    const filtered = yesterdayTickets.filter(t => t.system.toLowerCase().includes(system));
                    return `📅 Yesterday (${yesterdayStr}), there ${filtered.length === 1 ? 'was' : 'were'} ${filtered.length} ${system.toUpperCase()} complaint${filtered.length !== 1 ? 's' : ''}.\n\n${filtered.length > 0 ? 'Details:\n' + filtered.map(t => `• ${t.villa}: ${t.details}`).join('\n') : ''}`;
                }
                return `📅 Yesterday (${yesterdayStr}), there were ${yesterdayTickets.length} total complaints.`;
            }
            
            // Question: "Today how many complaints?"
            if (q.includes('today')) {
                const todayTickets = allTickets.filter(t => {
                    const ticketDate = parseTicketDate(t.date);
                    return ticketDate && ticketDate.toDateString() === today.toDateString();
                });
                
                if (system) {
                    const filtered = todayTickets.filter(t => t.system.toLowerCase().includes(system));
                    return `📅 Today, there ${filtered.length === 1 ? 'is' : 'are'} ${filtered.length} ${system.toUpperCase()} complaint${filtered.length !== 1 ? 's' : ''}.\n\n${filtered.length > 0 ? 'Details:\n' + filtered.map(t => `• ${t.villa}: ${t.details}`).join('\n') : ''}`;
                }
                return `📅 Today, there are ${todayTickets.length} total complaints.`;
            }
            
            // Question: "Any pending in Villa 55?" or "Any pending in Flat 511?"
            if (villa && (q.includes('pending') || q.includes('open'))) {
                const villaTickets = allTickets.filter(t => 
                    t.villa.toLowerCase() === villa.toLowerCase() || 
                    t.villa.toLowerCase().replace(/\s+/g, '') === villa.toLowerCase().replace(/\s+/g, '')
                );
                const pending = villaTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending') || t.status.trim() === '');
                
                if (pending.length > 0) {
                    const systemBreakdown = {};
                    pending.forEach(t => {
                        systemBreakdown[t.system] = (systemBreakdown[t.system] || 0) + 1;
                    });
                    return `⚠️ ${villa} has ${pending.length} pending complaint${pending.length !== 1 ? 's' : ''}:\n\n${Object.entries(systemBreakdown).map(([s, c]) => `• ${s}: ${c}`).join('\n')}\n\nRecent issues:\n${pending.slice(-3).map(t => `• ${t.system}: ${t.details} (MRF: ${t.mrfNo})`).join('\n')}`;
                } else {
                    return `✅ Great news! ${villa} has no pending complaints. All issues are resolved.`;
                }
            }
            
            // Question: "Villa X how many times AC complaint?" or "Flat 511 how many AC complaints?"
            if (villa && system) {
                const filtered = allTickets.filter(t => 
                    (t.villa.toLowerCase() === villa.toLowerCase() || 
                     t.villa.toLowerCase().replace(/\s+/g, '') === villa.toLowerCase().replace(/\s+/g, '')) && 
                    t.system.toLowerCase().includes(system)
                );
                
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = filtered.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                return `🏠 ${villa} - ${system.toUpperCase()} Complaints:\n\n📊 Total: ${filtered.length} complaints\n✅ Completed: ${completed}\n⏳ Pending: ${pending}\n\n${filtered.length > 0 ? 'Recent issues:\n' + filtered.slice(-3).map(t => `• ${t.date}: ${t.details} (${t.status})`).join('\n') : 'No complaints found.'}`;
            }
            
            // Question: "Villa X complaints" or "Flat 511 all issues" or "Any issues in Flat 224?"
            if (villa) {
                const filtered = allTickets.filter(t => 
                    t.villa.toLowerCase() === villa.toLowerCase() || 
                    t.villa.toLowerCase().replace(/\s+/g, '') === villa.toLowerCase().replace(/\s+/g, '')
                );
                const systemBreakdown = {};
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending'));
                
                filtered.forEach(t => {
                    systemBreakdown[t.system] = (systemBreakdown[t.system] || 0) + 1;
                });
                
                return `🏠 ${villa} Summary:\n\n📊 Total complaints: ${filtered.length}\n⚠️ Pending: ${pending.length}\n\nBy System:\n${Object.entries(systemBreakdown).map(([s, c]) => `• ${s}: ${c}`).join('\n')}\n\n${pending.length > 0 ? '\nPending Issues:\n' + pending.slice(-3).map(t => `• ${t.system}: ${t.details}`).join('\n') : ''}`;
            }
            
            // Question: "AC complaints" or "Show me electrical issues"
            if (system) {
                const filtered = allTickets.filter(t => t.system.toLowerCase().includes(system));
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = filtered.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                // Get top villas with this issue
                const villaCounts = {};
                filtered.forEach(t => {
                    villaCounts[t.villa] = (villaCounts[t.villa] || 0) + 1;
                });
                const topVillas = Object.entries(villaCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);
                
                return `🔧 ${system.toUpperCase()} System Report:\n\n📊 Total: ${filtered.length} complaints\n✅ Completed: ${completed}\n⏳ Pending: ${pending}\n\nTop Affected Villas:\n${topVillas.map(([v, c], i) => `${i + 1}. ${v}: ${c} complaints`).join('\n')}\n\n${pending > 0 ? `Recent pending:\n${filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).slice(-3).map(t => `• ${t.villa}: ${t.details}`).join('\n')}` : ''}`;
            }
            
            // General stats
            if (q.includes('total') || q.includes('how many complaint')) {
                const pending = allTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = allTickets.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                return `📊 Overall Statistics:\n\n🎫 Total tickets: ${allTickets.length}\n⏳ Pending: ${pending}\n✅ Completed: ${completed}\n\nBy System:\n${Object.entries(allTickets.reduce((acc, t) => {
                    acc[t.system] = (acc[t.system] || 0) + 1;
                    return acc;
                }, {})).sort((a, b) => b[1] - a[1]).map(([s, c]) => `• ${s}: ${c}`).join('\n')}`;
            }
            
            return `I can help you with questions like:\n\n📅 Time-based:\n• "Yesterday how many AC complaints?"\n• "Today's complaints?"\n\n🏠 Villa/Flat specific:\n• "Villa 130 how many AC complaints?"\n• "Flat 511 any pending?"\n• "Any pending in Flat 224?"\n• "Villa 95 all complaints?"\n\n🔧 System analysis:\n• "Which villa has most AC problems?"\n• "Which flat has most plumbing issues?"\n• "Show electrical complaints"\n• "Pending carpentry work?"\n\n💡 Try asking a specific question!`;
        }

        // Handle Enter key in chat
        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }
        }

        // Export to CSV
        function exportCSV() {
            const headers = ['Date', 'Time', 'MRF No', 'Villa', 'System', 'Receptionist', 'Details', 'Intimated By', 'Action Taker', 'Action Date', 'Status'];
            const rows = filteredTickets.map(t => [
                t.date, t.time, t.mrfNo, t.villa, t.system, t.receptionist,
                `"${t.details}"`, t.intimatedBy, t.actionTaker, t.actionDate, t.status
            ]);
            
            const csv = [headers, ...rows].map(row => row.join(',\t')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `maintenance_report_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Get statistics
        function getStats() {
            const completed = filteredTickets.filter(t => t.status.toLowerCase().includes('completed')).length;
            const pending = filteredTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending') || t.status.trim() === '').length;
            const inProgress = filteredTickets.length - completed - pending;
            
            return { total: filteredTickets.length, completed, pending, inProgress };
        }

        // Get system-wise pending counts
        function getSystemPendingStats() {
            const pendingTickets = allTickets.filter(t => 
                !t.status || t.status.toLowerCase().includes('pending') || t.status.trim() === ''
            );
            
            const systemStats = {};
            pendingTickets.forEach(ticket => {
                const system = ticket.system || 'Other';
                systemStats[system] = (systemStats[system] || 0) + 1;
            });
            
            // Define system colors and icons
            const systemConfig = {
                'AC': { color: 'blue', icon: '❄️', label: 'AC' },
                'Electrical': { color: 'yellow', icon: '⚡', label: 'Electrical' },
                'Plumbing': { color: 'cyan', icon: '🚰', label: 'Plumbing' },
                'Carpentry': { color: 'amber', icon: '🔨', label: 'Carpentry' },
                'Painting': { color: 'purple', icon: '🎨', label: 'Painting' },
                'Mason': { color: 'gray', icon: '🧱', label: 'Mason' }
            };
            
            return Object.keys(systemConfig).map(system => ({
                system: system,
                count: systemStats[system] || 0,
                ...systemConfig[system]
            }));
        }

        // Get unique values for dropdowns
        function getUniqueValues(field) {
            const values = [...new Set(allTickets.map(t => t[field]).filter(v => v))];
            return values.sort();
        }

        // Render the page
        function render() {
            const stats = getStats();
            const systems = getUniqueValues('system');
            const systemPending = getSystemPendingStats();
            
            // Get only the most recent 25 tickets (REVERSE because newest is at bottom of sheet)
            const recentTickets = [...filteredTickets].reverse().slice(0, 25);
            
            const html = `
                <div class="min-h-screen p-4 md:p-6">
                    <div class="max-w-7xl mx-auto">
                        <!-- Header -->
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                <div>
                                    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">🏢 Villa Maintenance Dashboard</h1>
                                    <p class="text-gray-600 mt-1">Track and manage maintenance requests - 2025</p>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="resetDashboard()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                                        </svg>
                                        Back to Dashboard
                                    </button>
                                    <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                        Refresh
                                    </button>
                                </div>
                            </div>

                            <!-- Stats -->
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-blue-50 rounded-lg p-4">
                                    <p class="text-blue-600 text-sm font-medium">Total Tickets</p>
                                    <p class="text-3xl font-bold text-blue-900">${stats.total}</p>
                                </div>
                                <div class="bg-yellow-50 rounded-lg p-4">
                                    <p class="text-yellow-600 text-sm font-medium">Pending</p>
                                    <p class="text-3xl font-bold text-yellow-900">${stats.pending}</p>
                                </div>
                                <div class="bg-green-50 rounded-lg p-4">
                                    <p class="text-green-600 text-sm font-medium">Completed</p>
                                    <p class="text-3xl font-bold text-green-900">${stats.completed}</p>
                                </div>
                                <div class="bg-purple-50 rounded-lg p-4">
                                    <p class="text-purple-600 text-sm font-medium">In Progress</p>
                                    <p class="text-3xl font-bold text-purple-900">${stats.inProgress}</p>
                                </div>
                            </div>
                        </div>

                        <!-- System-wise Pending Summary -->
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4">⚙️ Pending Work by System</h2>
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                                ${systemPending.map(sys => `
                                    <div class="bg-gradient-to-br from-${sys.color}-50 to-${sys.color}-100 rounded-lg p-4 border-l-4 border-${sys.color}-500 hover:shadow-md transition-shadow cursor-pointer" 
                                         onclick="updateFilter('system', '${sys.system}'); updateFilter('status', 'pending');">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-2xl">${sys.icon}</span>
                                            <span class="text-xs font-semibold text-${sys.color}-600 bg-white px-2 py-1 rounded">PENDING</span>
                                        </div>
                                        <p class="text-${sys.color}-800 font-semibold text-sm mb-1">${sys.label}</p>
                                        <p class="text-3xl font-bold text-${sys.color}-900">${sys.count}</p>
                                        <p class="text-xs text-${sys.color}-600 mt-1">Click to filter</p>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mt-4 p-3 bg-gray-50 rounded-lg">
                                <p class="text-sm text-gray-600">
                                    <strong>Total Pending:</strong> ${systemPending.reduce((sum, sys) => sum + sys.count, 0)} tickets across all systems
                                </p>
                            </div>
                        </div>

                        <!-- Filters -->
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4">🔍 Search & Filter</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <input
                                    type="text"
                                    placeholder="Search MRF No (e.g., 25/33047)"
                                    value="${filters.mrfNo}"
                                    onchange="updateFilter('mrfNo', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                                <input
                                    type="text"
                                    placeholder="Search Villa/Flat"
                                    value="${filters.villa}"
                                    onchange="updateFilter('villa', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                                <select
                                    onchange="updateFilter('system', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                >
                                    <option value="">All Systems</option>
                                    ${systems.map(s => `<option value="${s}" ${filters.system === s ? 'selected' : ''}>${s}</option>`).join('')}
                                </select>
                                <select
                                    onchange="updateFilter('status', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                >
                                    <option value="">All Status</option>
                                    <option value="completed" ${filters.status === 'completed' ? 'selected' : ''}>Completed</option>
                                    <option value="pending" ${filters.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="progress" ${filters.status === 'progress' ? 'selected' : ''}>In Progress</option>
                                </select>
                            </div>
                            <button onclick="exportCSV()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                </svg>
                                Export to CSV
                            </button>
                        </div>

                        <!-- Table -->
                        <div class="bg-white rounded-lg shadow-sm p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-semibold text-gray-800">📋 Recent Maintenance Tickets</h2>
                                <span class="text-sm text-gray-600">Showing latest 25 of ${filteredTickets.length} tickets</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full min-w-max">
                                    <thead>
                                        <tr class="border-b-2 border-gray-200">
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Date</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Time</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">MRF No</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Villa/Flat</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">System</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Details</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Intimated By</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Action Taker</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${recentTickets.length === 0 ? `
                                            <tr>
                                                <td colspan="9" class="text-center py-8 text-gray-500">
                                                    No tickets found. Try adjusting your filters.
                                                </td>
                                            </tr>
                                        ` : recentTickets.map(ticket => `
                                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.date}</td>
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.time}</td>
                                                <td class="py-3 px-4 font-medium text-blue-600">${ticket.mrfNo}</td>
                                                <td class="py-3 px-4 text-gray-700">${ticket.villa}</td>
                                                <td class="py-3 px-4">
                                                    <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm">
                                                        ${ticket.system}
                                                    </span>
                                                </td>
                                                <td class="py-3 px-4 text-gray-700 max-w-xs truncate" title="${ticket.details}">
                                                    ${ticket.details}
                                                </td>
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.intimatedBy || '-'}</td>
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.actionTaker || '-'}</td>
                                                <td class="py-3 px-4">
                                                    <span class="px-2 py-1 rounded text-sm font-medium whitespace-nowrap ${
                                                        ticket.status.toLowerCase().includes('completed') ? 'bg-green-100 text-green-800' :
                                                        ticket.status.toLowerCase().includes('progress') ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }">
                                                        ${ticket.status || 'Pending'}
                                                    </span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AI Chat Bot -->
                <div class="fixed bottom-6 right-6 z-50">
                    ${showChat ? `
                        <div class="bg-white rounded-lg shadow-2xl w-96 h-[500px] flex flex-col">
                            <!-- Chat Header -->
                            <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-t-lg flex justify-between items-center">
                                <div class="flex items-center gap-2">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                                    </svg>
                                    <div>
                                        <h3 class="font-semibold">AI Assistant</h3>
                                        <p class="text-xs opacity-90">Ask about maintenance data</p>
                                    </div>
                                </div>
                                <button onclick="toggleChat()" class="hover:bg-white/20 rounded p-1">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                    </svg>
                                </button>
                            </div>

                            <!-- Chat Messages -->
                            <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
                                ${chatHistory.length === 0 ? `
                                    <div class="text-center text-gray-500 mt-8">
                                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                        </svg>
                                        <p class="text-sm mb-2">👋 Hi! I'm your AI assistant</p>
                                        <p class="text-xs">Ask me about:</p>
                                        <ul class="text-xs mt-2 space-y-1">
                                            <li>• Villa complaints</li>
                                            <li>• System statistics</li>
                                            <li>• Pending issues</li>
                                        </ul>
                                    </div>
                                ` : chatHistory.map((msg, idx) => `
                                    <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                                        <div class="${msg.role === 'user' ? 'bg-blue-600 text-white' : 'bg-white text-gray-800'} rounded-lg p-3 max-w-[80%] shadow relative group">
                                            <p class="text-sm whitespace-pre-wrap">${msg.content}</p>
                                            ${msg.role === 'assistant' ? `
                                                <button 
                                                    onclick="speakText(\`${msg.content.replace(/`/g, '\\`').replace(/\n/g, ' ')}\`)"
                                                    class="absolute -right-2 -top-2 bg-blue-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                                                    title="Read aloud"
                                                >
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                                                    </svg>
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Chat Input -->
                            <div class="p-4 border-t bg-white rounded-b-lg">
                                <div class="flex gap-2 mb-2">
                                    <button
                                        onclick="startVoiceInput()"
                                        class="${isListening ? 'bg-red-600 animate-pulse' : 'bg-green-600'} text-white px-3 py-2 rounded-lg hover:opacity-90 flex items-center gap-2"
                                        title="${isListening ? 'Stop listening' : 'Start voice input'}"
                                    >
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
                                        </svg>
                                        ${isListening ? '🔴 Listening...' : '🎤 Voice'}
                                    </button>
                                    <input
                                        id="chatInput"
                                        type="text"
                                        placeholder="${isListening ? 'Listening... speak now!' : 'Type or use voice...'}"
                                        onkeypress="handleChatKeyPress(event)"
                                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm"
                                    />
                                    <button
                                        onclick="sendChatMessage()"
                                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-1"
                                        title="Send message"
                                    >
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                                        </svg>
                                    </button>
                                </div>
                                <div class="flex items-center justify-between">
                                    <p class="text-xs text-gray-500">💡 Click 🎤 and say: "Villa 130 AC complaints"</p>
                                    <button
                                        onclick="stopSpeaking()"
                                        class="text-xs text-red-600 hover:text-red-800 flex items-center gap-1"
                                        title="Stop speaking"
                                    >
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd"/>
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
                                        </svg>
                                        Mute
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <button
                            onclick="toggleChat()"
                            class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-full shadow-lg hover:shadow-xl transition-all hover:scale-110"
                        >
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                            </svg>
                        </button>
                    `}
                </div>
            `;
            
            document.getElementById('app').innerHTML = html;
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
