<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p class="text-xl text-gray-600">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const SHEET_ID = '1T8p2ojn8W6jmC5rTAcZ7xxE7MKy-n9fa5ke4QFzVQY4';
        const GID = '931447490';
        const SITE_PASSWORD = 'villa2025';

        let isAuthenticated = false;
        let allTickets = [];
        let filteredTickets = [];
        let filters = { mrfNo: '', villa: '', system: '', status: '' };
        let chatHistory = [];
        let showChat = false;
        let showPassword = false;

        // Check if already authenticated
        if (sessionStorage.getItem('auth') === 'true') {
            isAuthenticated = true;
            loadData();
        } else {
            showLogin();
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div class="text-center mb-8">
                            <div class="bg-gradient-to-br from-blue-600 to-purple-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                            <h1 class="text-3xl font-bold text-gray-800">🏢 Villa Maintenance</h1>
                            <p class="text-gray-600 mt-2">Secure Access Required</p>
                        </div>
                        <div class="space-y-4">
                            <div class="relative">
                                <input
                                    id="pass"
                                    type="password"
                                    placeholder="Enter password"
                                    class="w-full px-4 py-3 pr-12 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    onkeypress="if(event.key==='Enter') login()"
                                />
                                <button onclick="togglePass()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                                    <svg id="eye" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                            <div id="err" class="hidden bg-red-50 border-l-4 border-red-500 p-3 rounded text-sm text-red-700"></div>
                            <button onclick="login()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:opacity-90">
                                🔓 Unlock Dashboard
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 text-center mt-6">🔒 Authorized personnel only</p>
                    </div>
                </div>
            `;
            document.getElementById('pass').focus();
        }

        function togglePass() {
            const input = document.getElementById('pass');
            showPassword = !showPassword;
            input.type = showPassword ? 'text' : 'password';
        }

        function login() {
            const pass = document.getElementById('pass').value.trim();
            const err = document.getElementById('err');
            
            if (pass === SITE_PASSWORD) {
                isAuthenticated = true;
                sessionStorage.setItem('auth', 'true');
                loadData();
            } else {
                err.textContent = '❌ Incorrect password';
                err.classList.remove('hidden');
                document.getElementById('pass').value = '';
            }
        }

        function logout() {
            isAuthenticated = false;
            sessionStorage.removeItem('auth');
            location.reload();
        }

        async function loadData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
                const res = await fetch(url);
                const csv = await res.text();
                const lines = csv.split('\n').filter(l => l.trim());
                
                allTickets = [];
                for (let i = 1; i < lines.length; i++) {
                    const vals = parseCSVLine(lines[i]);
                    if (vals[2]) {
                        allTickets.push({
                            date: vals[0] || '', time: vals[1] || '', mrfNo: vals[2] || '',
                            villa: vals[3] || '', system: vals[4] || '', receptionist: vals[5] || '',
                            details: vals[6] || '', intimatedBy: vals[7] || '', actionTaker: vals[8] || '',
                            actionDate: vals[9] || '', status: vals[10] || 'Pending'
                        });
                    }
                }
                applyFilters();
                render();
            } catch(e) {
                alert('Error loading data: ' + e.message);
            }
        }

        function parseCSVLine(line) {
            const vals = [];
            let cur = '', inQ = false;
            for (let c of line) {
                if (c === '"') inQ = !inQ;
                else if (c === ',' && !inQ) { vals.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                else cur += c;
            }
            vals.push(cur.trim().replace(/^"|"$/g, ''));
            return vals;
        }

        function applyFilters() {
            filteredTickets = allTickets.filter(t => {
                const vm = !filters.villa || t.villa.toLowerCase() === filters.villa.toLowerCase();
                return vm &&
                    (!filters.mrfNo || t.mrfNo.toLowerCase().includes(filters.mrfNo.toLowerCase())) &&
                    (!filters.system || t.system.toLowerCase().includes(filters.system.toLowerCase())) &&
                    (!filters.status || t.status.toLowerCase().includes(filters.status.toLowerCase()));
            });
        }

        function updateFilter(k, v) {
            filters[k] = v;
            applyFilters();
            render();
        }

        function resetDashboard() {
            filters = { mrfNo: '', villa: '', system: '', status: '' };
            applyFilters();
            render();
        }

        function exportCSV() {
            const h = ['Date','Time','MRF No','Villa','System','Receptionist','Details','Intimated By','Action Taker','Action Date','Status'];
            const rows = filteredTickets.map(t => [t.date,t.time,t.mrfNo,t.villa,t.system,t.receptionist,`"${t.details}"`,t.intimatedBy,t.actionTaker,t.actionDate,t.status].join(','));
            const csv = [h.join(','), ...rows].join('\n');
            const blob = new Blob([csv], {type:'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'maintenance_report.csv';
            a.click();
        }

        function getSystemPending() {
            const pending = allTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending'));
            const cfg = {
                'AC': {color:'blue', icon:'❄️'}, 'Electrical': {color:'yellow', icon:'⚡'},
                'Plumbing': {color:'cyan', icon:'🚰'}, 'Carpentry': {color:'amber', icon:'🔨'},
                'Painting': {color:'purple', icon:'🎨'}, 'Mason': {color:'gray', icon:'🧱'}
            };
            return Object.keys(cfg).map(s => ({
                system: s, count: pending.filter(t => t.system === s).length, ...cfg[s]
            }));
        }

        function toggleChat() {
            showChat = !showChat;
            render();
        }

        function sendChat() {
            const inp = document.getElementById('chatInput');
            const q = inp.value.trim();
            if (!q) return;
            chatHistory.push({role:'user', content:q});
            inp.value = '';
            
            // Show typing indicator
            chatHistory.push({role:'assistant', content:'⏳ Analyzing...'});
            render();
            
            setTimeout(() => {
                chatHistory.pop(); // Remove typing indicator
                const ans = getSmartAnswer(q);
                chatHistory.push({role:'assistant', content:ans});
                render();
                setTimeout(() => {
                    const box = document.querySelector('.overflow-y-auto');
                    if (box) box.scrollTop = box.scrollHeight;
                }, 50);
            }, 300);
        }

        function getSmartAnswer(question) {
            const q = question.toLowerCase().trim()
                .replace(/villa no\.?/gi, 'villa')
                .replace(/flat no\.?/gi, 'flat')
                .replace(/\s+/g, ' ')
                .replace(/how many times?/gi, 'how many')
                .replace(/how much/gi, 'how many');
            
            // Parse date helper
            function parseDate(dateStr) {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const months = {
                        'january': 0, 'february': 1, 'march': 2, 'april': 3, 'may': 4, 'june': 5,
                        'july': 6, 'august': 7, 'september': 8, 'october': 9, 'november': 10, 'december': 11
                    };
                    return new Date(parts[2], months[parts[1].toLowerCase()], parseInt(parts[0]));
                }
                return null;
            }
            
            // Extract villa/flat
            const villaMatch = q.match(/villa\s*(\d+)/i);
            const flatMatch = q.match(/flat\s*(\d+)/i);
            let villa = villaMatch ? `Villa ${villaMatch[1]}` : flatMatch ? `Flat ${flatMatch[1]}` : null;
            
            // Extract system
            const systems = ['ac', 'electrical', 'plumbing', 'carpentry', 'painting', 'mason'];
            const system = systems.find(s => q.includes(s));
            
            // Detail keywords for searching
            const detailKeywords = {
                'interlock paint': ['interlock paint', 'interlock need to paint'],
                'door lock': ['door lock'],
                'washing machine': ['washing machine'],
                'water heater': ['water heater', 'heater', 'geyser'],
                'toilet': ['toilet', 'wc'],
                'sink': ['sink', 'basin'],
                'door': ['door'],
                'window': ['window'],
                'paint': ['paint', 'painting'],
                'leak': ['leak', 'leaking'],
                'drain': ['drain', 'clogged', 'blocked'],
                'light': ['light', 'bulb'],
                'fan': ['fan'],
                'ac': ['ac', 'air condition']
            };
            
            let foundItem = null;
            let searchKeys = [];
            
            // Check for detail-based search
            if (q.includes('interlock') && (q.includes('paint') || q.includes('painting'))) {
                foundItem = 'interlock paint';
                searchKeys = detailKeywords['interlock paint'];
            } else if (q.includes('washing') && q.includes('machine')) {
                foundItem = 'washing machine';
                searchKeys = detailKeywords['washing machine'];
            } else if (q.includes('water') && q.includes('heater')) {
                foundItem = 'water heater';
                searchKeys = detailKeywords['water heater'];
            } else {
                for (const [item, keywords] of Object.entries(detailKeywords)) {
                    if (keywords.some(kw => q.includes(kw))) {
                        foundItem = item;
                        searchKeys = keywords;
                        break;
                    }
                }
            }
            
            // Detail-based search
            if (foundItem) {
                const filtered = allTickets.filter(t => 
                    searchKeys.some(kw => t.details.toLowerCase().includes(kw))
                );
                if (filtered.length === 0) return `❌ No complaints found for "${foundItem}"`;
                
                const locations = {};
                filtered.forEach(t => locations[t.villa] = (locations[t.villa] || 0) + 1);
                const sorted = Object.entries(locations).sort((a,b) => b[1] - a[1]);
                
                return `🔍 ${foundItem.toUpperCase()} Search:\n\n📊 Total: ${filtered.length} complaints\n\n🏠 Locations (${sorted.length}):\n${sorted.slice(0,10).map(([v,c],i) => `${i+1}. ${v}: ${c}`).join('\n')}${sorted.length > 10 ? `\n...and ${sorted.length-10} more` : ''}\n\n📋 Recent:\n${filtered.slice(-3).map(t => `• ${t.villa}: ${t.details.substring(0,50)}...`).join('\n')}`;
            }
            
            // Yesterday/Today queries
            const today = new Date();
            const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
            
            if (q.includes('yesterday')) {
                const tickets = allTickets.filter(t => {
                    const d = parseDate(t.date);
                    return d && d.toDateString() === yesterday.toDateString();
                });
                if (system) {
                    const sys = tickets.filter(t => t.system.toLowerCase().includes(system));
                    return `📅 Yesterday (${yesterday.toLocaleDateString()}):\n\n${system.toUpperCase()}: ${sys.length} complaints\n\n${sys.length > 0 ? 'Details:\n' + sys.map(t => `• ${t.villa}: ${t.details}`).join('\n') : ''}`;
                }
                return `📅 Yesterday: ${tickets.length} total complaints`;
            }
            
            if (q.includes('today')) {
                const tickets = allTickets.filter(t => {
                    const d = parseDate(t.date);
                    return d && d.toDateString() === today.toDateString();
                });
                if (system) {
                    const sys = tickets.filter(t => t.system.toLowerCase().includes(system));
                    return `📅 Today:\n\n${system.toUpperCase()}: ${sys.length} complaints\n\n${sys.length > 0 ? sys.map(t => `• ${t.villa}: ${t.details}`).join('\n') : ''}`;
                }
                return `📅 Today: ${tickets.length} total complaints`;
            }
            
            // Top villas query
            if ((q.includes('top') || q.includes('most') || q.includes('which')) && q.includes('villa')) {
                const counts = {};
                const target = system || 'all';
                allTickets.forEach(t => {
                    if (!system || t.system.toLowerCase().includes(system))
                        counts[t.villa] = (counts[t.villa] || 0) + 1;
                });
                const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0,10);
                return `🏆 Top Locations (${target}):\n\n${sorted.map((v,i) => `${i+1}. ${v[0]}: ${v[1]} complaints`).join('\n')}`;
            }
            
            // Technician workload
            if (q.includes('technician') || q.includes('action taker')) {
                const counts = {};
                allTickets.forEach(t => {
                    if (t.actionTaker) counts[t.actionTaker] = (counts[t.actionTaker] || 0) + 1;
                });
                const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
                return `👷 Technician Workload:\n\n${sorted.map(([tech,c],i) => `${i+1}. ${tech}: ${c} tasks`).join('\n')}`;
            }
            
            // Compare villas
            if (q.includes('compare') && villa) {
                const matches = q.match(/villa\s*(\d+)/gi) || q.match(/flat\s*(\d+)/gi);
                if (matches && matches.length >= 2) {
                    const v1 = matches[0].replace(/villa\s*/i, 'Villa ').replace(/flat\s*/i, 'Flat ');
                    const v2 = matches[1].replace(/villa\s*/i, 'Villa ').replace(/flat\s*/i, 'Flat ');
                    const t1 = allTickets.filter(t => t.villa.toLowerCase() === v1.toLowerCase());
                    const t2 = allTickets.filter(t => t.villa.toLowerCase() === v2.toLowerCase());
                    return `⚖️ ${v1} vs ${v2}:\n\n${v1}:\n• Total: ${t1.length}\n• Pending: ${t1.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length}\n\n${v2}:\n• Total: ${t2.length}\n• Pending: ${t2.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length}`;
                }
            }
            
            // Villa + pending
            if (villa && (q.includes('pending') || q.includes('open'))) {
                const tickets = allTickets.filter(t => t.villa.toLowerCase() === villa.toLowerCase());
                const pending = tickets.filter(t => !t.status || t.status.toLowerCase().includes('pending'));
                if (pending.length > 0) {
                    const sys = {};
                    pending.forEach(t => sys[t.system] = (sys[t.system] || 0) + 1);
                    return `⚠️ ${villa} Pending (${pending.length}):\n\n${Object.entries(sys).map(([s,c]) => `• ${s}: ${c}`).join('\n')}\n\nRecent:\n${pending.slice(-3).map(t => `• ${t.system}: ${t.details}`).join('\n')}`;
                }
                return `✅ ${villa}: No pending complaints!`;
            }
            
            // Villa + system
            if (villa && system) {
                const filtered = allTickets.filter(t => 
                    t.villa.toLowerCase() === villa.toLowerCase() && t.system.toLowerCase().includes(system)
                );
                const p = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                return `🏠 ${villa} - ${system.toUpperCase()}:\n\n📊 Total: ${filtered.length}\n⏳ Pending: ${p}\n✅ Completed: ${filtered.length - p}\n\n${filtered.length > 0 ? 'Recent:\n' + filtered.slice(-3).map(t => `• ${t.date}: ${t.details}`).join('\n') : ''}`;
            }
            
            // Just villa
            if (villa) {
                const tickets = allTickets.filter(t => t.villa.toLowerCase() === villa.toLowerCase());
                const sys = {};
                tickets.forEach(t => sys[t.system] = (sys[t.system] || 0) + 1);
                const pending = tickets.filter(t => !t.status || t.status.toLowerCase().includes('pending'));
                return `🏠 ${villa} Summary:\n\n📊 Total: ${tickets.length}\n⚠️ Pending: ${pending.length}\n\nBy System:\n${Object.entries(sys).map(([s,c]) => `• ${s}: ${c}`).join('\n')}`;
            }
            
            // Just system
            if (system) {
                const filtered = allTickets.filter(t => t.system.toLowerCase().includes(system));
                const p = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const counts = {};
                filtered.forEach(t => counts[t.villa] = (counts[t.villa] || 0) + 1);
                const top = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0,5);
                return `🔧 ${system.toUpperCase()} Report:\n\n📊 Total: ${filtered.length}\n⏳ Pending: ${p}\n\nTop Villas:\n${top.map(([v,c],i) => `${i+1}. ${v}: ${c}`).join('\n')}`;
            }
            
            // Total/summary
            if (q.includes('total') || q.includes('summary') || q.includes('overall')) {
                const p = allTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const sys = {};
                allTickets.forEach(t => sys[t.system] = (sys[t.system] || 0) + 1);
                return `📊 Overall Summary:\n\n🎫 Total: ${allTickets.length}\n⏳ Pending: ${p}\n✅ Completed: ${allTickets.length - p}\n\nBy System:\n${Object.entries(sys).sort((a,b) => b[1] - a[1]).map(([s,c]) => `• ${s}: ${c}`).join('\n')}`;
            }
            
            // Default help
            return `I can answer:\n\n📅 Time:\n• "Yesterday AC complaints?"\n• "Today's issues?"\n\n🏠 Location:\n• "Villa 130 AC problems?"\n• "Flat 511 pending?"\n• "Which villa has most issues?"\n\n🔍 Items:\n• "Washing machine complaints?"\n• "Interlock paint requests?"\n• "Water heater issues?"\n\n🔧 Systems:\n• "Plumbing report?"\n• "AC complaints?"\n\nTry asking!`;
        }

        function render() {
            if (!isAuthenticated) { showLogin(); return; }
            
            const stats = {
                total: filteredTickets.length,
                pending: filteredTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length,
                completed: filteredTickets.filter(t => t.status.toLowerCase().includes('completed')).length,
                progress: filteredTickets.filter(t => t.status.toLowerCase().includes('progress')).length
            };
            const sysPending = getSystemPending();
            const systems = [...new Set(allTickets.map(t => t.system))];
            const recent = [...filteredTickets].reverse().slice(0,25);

            document.getElementById('app').innerHTML = `
                <div class="min-h-screen p-4 md:p-6">
                    <div class="max-w-7xl mx-auto">
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div class="flex justify-between items-center mb-4">
                                <div><h1 class="text-2xl md:text-3xl font-bold">🏢 Villa Maintenance Dashboard</h1>
                                <p class="text-gray-600">Track and manage maintenance - 2025</p></div>
                                <div class="flex gap-2">
                                    <button onclick="resetDashboard()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">🏠 Home</button>
                                    <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">🔄 Refresh</button>
                                    <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">🚪 Logout</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-blue-50 rounded-lg p-4"><p class="text-blue-600 text-sm font-medium">Total</p><p class="text-3xl font-bold text-blue-900">${stats.total}</p></div>
                                <div class="bg-yellow-50 rounded-lg p-4"><p class="text-yellow-600 text-sm font-medium">Pending</p><p class="text-3xl font-bold text-yellow-900">${stats.pending}</p></div>
                                <div class="bg-green-50 rounded-lg p-4"><p class="text-green-600 text-sm font-medium">Completed</p><p class="text-3xl font-bold text-green-900">${stats.completed}</p></div>
                                <div class="bg-purple-50 rounded-lg p-4"><p class="text-purple-600 text-sm font-medium">In Progress</p><p class="text-3xl font-bold text-purple-900">${stats.progress}</p></div>
                            </div>
                        </div>

                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h2 class="text-xl font-semibold mb-4">⚙️ Pending Work by System</h2>
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                                ${sysPending.map(s => `
                                    <div class="bg-${s.color}-50 rounded-lg p-4 border-l-4 border-${s.color}-500 cursor-pointer hover:shadow-md" 
                                         onclick="updateFilter('system', '${s.system}'); updateFilter('status', 'pending');">
                                        <div class="text-2xl mb-2">${s.icon}</div>
                                        <p class="text-${s.color}-800 font-semibold text-sm">${s.system}</p>
                                        <p class="text-3xl font-bold text-${s.color}-900">${s.count}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h2 class="text-xl font-semibold mb-4">🔍 Search & Filter</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <input type="text" placeholder="MRF No" value="${filters.mrfNo}" onchange="updateFilter('mrfNo', this.value)" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"/>
                                <input type="text" placeholder="Villa/Flat" value="${filters.villa}" onchange="updateFilter('villa', this.value)" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"/>
                                <select onchange="updateFilter('system', this.value)" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">All Systems</option>
                                    ${systems.map(s => `<option value="${s}" ${filters.system===s?'selected':''}>${s}</option>`).join('')}
                                </select>
                                <select onchange="updateFilter('status', this.value)" class="px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">All Status</option>
                                    <option value="pending" ${filters.status==='pending'?'selected':''}>Pending</option>
                                    <option value="progress" ${filters.status==='progress'?'selected':''}>In Progress</option>
                                    <option value="completed" ${filters.status==='completed'?'selected':''}>Completed</option>
                                </select>
                            </div>
                            <button onclick="exportCSV()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700">📥 Export CSV</button>
                        </div>

                        <div class="bg-white rounded-lg shadow-sm p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-semibold">📋 Recent Tickets</h2>
                                <span class="text-sm text-gray-600">Latest 25 of ${filteredTickets.length}</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full">
                                    <thead><tr class="border-b-2">
                                        <th class="text-left py-3 px-4">Date</th><th class="text-left py-3 px-4">Time</th><th class="text-left py-3 px-4">MRF No</th>
                                        <th class="text-left py-3 px-4">Villa</th><th class="text-left py-3 px-4">System</th><th class="text-left py-3 px-4">Details</th>
                                        <th class="text-left py-3 px-4">Intimated By</th><th class="text-left py-3 px-4">Action Taker</th><th class="text-left py-3 px-4">Status</th>
                                    </tr></thead>
                                    <tbody>
                                        ${recent.map(t => `
                                            <tr class="border-b hover:bg-gray-50">
                                                <td class="py-3 px-4 text-sm">${t.date}</td><td class="py-3 px-4 text-sm">${t.time}</td>
                                                <td class="py-3 px-4 font-medium text-blue-600">${t.mrfNo}</td><td class="py-3 px-4">${t.villa}</td>
                                                <td class="py-3 px-4"><span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm">${t.system}</span></td>
                                                <td class="py-3 px-4 max-w-xs truncate">${t.details}</td><td class="py-3 px-4 text-sm">${t.intimatedBy || '-'}</td>
                                                <td class="py-3 px-4 text-sm">${t.actionTaker || '-'}</td>
                                                <td class="py-3 px-4"><span class="px-2 py-1 rounded text-sm ${
                                                    t.status.toLowerCase().includes('completed') ? 'bg-green-100 text-green-800' :
                                                    t.status.toLowerCase().includes('progress') ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800'
                                                }">${t.status}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="fixed bottom-6 right-6 z-50">
                    ${showChat ? `
                        <div class="bg-white rounded-lg shadow-2xl w-96 h-96 flex flex-col">
                            <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-t-lg flex justify-between">
                                <div><h3 class="font-semibold">AI Assistant</h3><p class="text-xs">Ask about maintenance</p></div>
                                <button onclick="toggleChat()" class="hover:bg-white/20 rounded p-1">✕</button>
                            </div>
                            <div class="flex-1 overflow-y-auto p-4 bg-gray-50">
                                ${chatHistory.length === 0 ? '<p class="text-center text-gray-500 mt-8">👋 Ask me anything!</p>' :
                                chatHistory.map(m => `<div class="flex ${m.role==='user'?'justify-end':'justify-start'} mb-3">
                                    <div class="${m.role==='user'?'bg-blue-600 text-white':'bg-white'} rounded-lg p-3 max-w-xs shadow text-sm">${m.content}</div>
                                </div>`).join('')}
                            </div>
                            <div class="p-4 border-t">
                                <div class="flex gap-2">
                                    <input id="chatInput" type="text" placeholder="Ask..." onkeypress="if(event.key==='Enter')sendChat()" 
                                        class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm"/>
                                    <button onclick="sendChat()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">➤</button>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <button onclick="toggleChat()" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-full shadow-lg hover:shadow-xl">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                            </svg>
                        </button>
                    `}
                </div>
            `;
        }
    </script>
</body>
</html>
