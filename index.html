<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p class="text-xl text-gray-600">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration - PERMANENT GOOGLE SHEET LINK
        const SHEET_ID = '1T8p2ojn8W6jmC5rTAcZ7xxE7MKy-n9fa5ke4QFzVQY4';
        const GID = '931447490';

        let allTickets = [];
        let filteredTickets = [];
        let filters = {
            mrfNo: '',
            villa: '',
            system: '',
            status: ''
        };

        // Parse CSV
        function parseCSV(text) {
            const lines = text.split('\n').filter(line => line.trim());
            const tickets = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i];
                const values = [];
                let current = '';
                let inQuotes = false;
                
                for (let char of line) {
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        values.push(current.trim().replace(/^"|"$/g, ''));
                        current = '';
                    } else {
                        current += char;
                    }
                }
                values.push(current.trim().replace(/^"|"$/g, ''));
                
                if (values[2] && values[2].trim()) {
                    tickets.push({
                        date: values[0] || '',
                        time: values[1] || '',
                        mrfNo: values[2] || '',
                        villa: values[3] || '',
                        system: values[4] || '',
                        receptionist: values[5] || '',
                        details: values[6] || '',
                        intimatedBy: values[7] || '',
                        actionTaker: values[8] || '',
                        actionDate: values[9] || '',
                        status: values[10] || 'Pending'
                    });
                }
            }
            
            return tickets;
        }

        // Load data from Google Sheets
        async function loadData() {
            try {
                console.log('Loading data...');
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
                const response = await fetch(url);
                const text = await response.text();
                
                console.log('Data loaded, parsing...');
                allTickets = parseCSV(text);
                console.log('Tickets found:', allTickets.length);
                
                applyFilters();
                render();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('app').innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-6">
                        <div class="bg-red-50 border-l-4 border-red-500 p-6 max-w-2xl">
                            <h2 class="text-xl font-bold text-red-800 mb-2">Error Loading Data</h2>
                            <p class="text-red-700 mb-4">${error.message}</p>
                            <div class="text-sm text-red-600">
                                <p class="font-semibold mb-2">Please check:</p>
                                <ol class="list-decimal ml-5 space-y-1">
                                    <li>Your Google Sheet is shared as "Anyone with the link can view"</li>
                                    <li>The sheet ID is correct: ${SHEET_ID}</li>
                                    <li>The GID (tab ID) is correct: ${GID}</li>
                                </ol>
                            </div>
                            <button onclick="loadData()" class="mt-4 bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                                Try Again
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        // Apply filters
        function applyFilters() {
            filteredTickets = allTickets.filter(ticket => {
                // Exact match for villa if filter is set, otherwise show all
                const villaMatch = !filters.villa || ticket.villa.toLowerCase() === filters.villa.toLowerCase();
                
                return (
                    villaMatch &&
                    (!filters.mrfNo || ticket.mrfNo.toLowerCase().includes(filters.mrfNo.toLowerCase())) &&
                    (!filters.system || ticket.system.toLowerCase().includes(filters.system.toLowerCase())) &&
                    (!filters.status || ticket.status.toLowerCase().includes(filters.status.toLowerCase()))
                );
            });
        }

        // Update filter
        function updateFilter(key, value) {
            filters[key] = value;
            applyFilters();
            render();
        }

        // Clear all filters and return to dashboard
        function resetDashboard() {
            filters = {
                mrfNo: '',
                villa: '',
                system: '',
                status: ''
            };
            applyFilters();
            render();
        }

        // Export to CSV
        function exportCSV() {
            const headers = ['Date', 'Time', 'MRF No', 'Villa', 'System', 'Receptionist', 'Details', 'Intimated By', 'Action Taker', 'Action Date', 'Status'];
            const rows = filteredTickets.map(t => [
                t.date, t.time, t.mrfNo, t.villa, t.system, t.receptionist,
                `"${t.details}"`, t.intimatedBy, t.actionTaker, t.actionDate, t.status
            ]);
            
            const csv = [headers, ...rows].map(row => row.join(',\t')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `maintenance_report_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
        }

        // Get statistics
        function getStats() {
            const completed = filteredTickets.filter(t => t.status.toLowerCase().includes('completed')).length;
            const pending = filteredTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending') || t.status.trim() === '').length;
            const inProgress = filteredTickets.length - completed - pending;
            
            return { total: filteredTickets.length, completed, pending, inProgress };
        }

        // Get system-wise pending counts
        function getSystemPendingStats() {
            const pendingTickets = allTickets.filter(t => 
                !t.status || t.status.toLowerCase().includes('pending') || t.status.trim() === ''
            );
            
            const systemStats = {};
            pendingTickets.forEach(ticket => {
                const system = ticket.system || 'Other';
                systemStats[system] = (systemStats[system] || 0) + 1;
            });
            
            // Define system colors and icons
            const systemConfig = {
                'AC': { color: 'blue', icon: '❄️', label: 'AC' },
                'Electrical': { color: 'yellow', icon: '⚡', label: 'Electrical' },
                'Plumbing': { color: 'cyan', icon: '🚰', label: 'Plumbing' },
                'Carpentry': { color: 'amber', icon: '🔨', label: 'Carpentry' },
                'Painting': { color: 'purple', icon: '🎨', label: 'Painting' },
                'Mason': { color: 'gray', icon: '🧱', label: 'Mason' }
            };
            
            return Object.keys(systemConfig).map(system => ({
                system: system,
                count: systemStats[system] || 0,
                ...systemConfig[system]
            }));
        }

        // Get unique values for dropdowns
        function getUniqueValues(field) {
            const values = [...new Set(allTickets.map(t => t[field]).filter(v => v))];
            return values.sort();
        }

        // Render the page
        function render() {
            const stats = getStats();
            const systems = getUniqueValues('system');
            const systemPending = getSystemPendingStats();
            
            // Get only the most recent 25 tickets (REVERSE because newest is at bottom of sheet)
            const recentTickets = [...filteredTickets].reverse().slice(0, 25);
            
            const html = `
                <div class="min-h-screen p-4 md:p-6">
                    <div class="max-w-7xl mx-auto">
                        <!-- Header -->
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                                <div>
                                    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">🏢 Villa Maintenance Dashboard</h1>
                                    <p class="text-gray-600 mt-1">Track and manage maintenance requests - 2025</p>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="resetDashboard()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                                        </svg>
                                        Back to Dashboard
                                    </button>
                                    <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 flex items-center gap-2">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                        Refresh
                                    </button>
                                </div>
                            </div>

                            <!-- Stats -->
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div class="bg-blue-50 rounded-lg p-4">
                                    <p class="text-blue-600 text-sm font-medium">Total Tickets</p>
                                    <p class="text-3xl font-bold text-blue-900">${stats.total}</p>
                                </div>
                                <div class="bg-yellow-50 rounded-lg p-4">
                                    <p class="text-yellow-600 text-sm font-medium">Pending</p>
                                    <p class="text-3xl font-bold text-yellow-900">${stats.pending}</p>
                                </div>
                                <div class="bg-green-50 rounded-lg p-4">
                                    <p class="text-green-600 text-sm font-medium">Completed</p>
                                    <p class="text-3xl font-bold text-green-900">${stats.completed}</p>
                                </div>
                                <div class="bg-purple-50 rounded-lg p-4">
                                    <p class="text-purple-600 text-sm font-medium">In Progress</p>
                                    <p class="text-3xl font-bold text-purple-900">${stats.inProgress}</p>
                                </div>
                            </div>
                        </div>

                        <!-- System-wise Pending Summary -->
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4">⚙️ Pending Work by System</h2>
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                                ${systemPending.map(sys => `
                                    <div class="bg-gradient-to-br from-${sys.color}-50 to-${sys.color}-100 rounded-lg p-4 border-l-4 border-${sys.color}-500 hover:shadow-md transition-shadow cursor-pointer" 
                                         onclick="updateFilter('system', '${sys.system}'); updateFilter('status', 'pending');">
                                        <div class="flex items-center justify-between mb-2">
                                            <span class="text-2xl">${sys.icon}</span>
                                            <span class="text-xs font-semibold text-${sys.color}-600 bg-white px-2 py-1 rounded">PENDING</span>
                                        </div>
                                        <p class="text-${sys.color}-800 font-semibold text-sm mb-1">${sys.label}</p>
                                        <p class="text-3xl font-bold text-${sys.color}-900">${sys.count}</p>
                                        <p class="text-xs text-${sys.color}-600 mt-1">Click to filter</p>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="mt-4 p-3 bg-gray-50 rounded-lg">
                                <p class="text-sm text-gray-600">
                                    <strong>Total Pending:</strong> ${systemPending.reduce((sum, sys) => sum + sys.count, 0)} tickets across all systems
                                </p>
                            </div>
                        </div>

                        <!-- Filters -->
                        <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4">🔍 Search & Filter</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                <input
                                    type="text"
                                    placeholder="Search MRF No (e.g., 25/33047)"
                                    value="${filters.mrfNo}"
                                    onchange="updateFilter('mrfNo', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                                <input
                                    type="text"
                                    placeholder="Search Villa/Flat"
                                    value="${filters.villa}"
                                    onchange="updateFilter('villa', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                />
                                <select
                                    onchange="updateFilter('system', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                >
                                    <option value="">All Systems</option>
                                    ${systems.map(s => `<option value="${s}" ${filters.system === s ? 'selected' : ''}>${s}</option>`).join('')}
                                </select>
                                <select
                                    onchange="updateFilter('status', this.value)"
                                    class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                                >
                                    <option value="">All Status</option>
                                    <option value="completed" ${filters.status === 'completed' ? 'selected' : ''}>Completed</option>
                                    <option value="pending" ${filters.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="progress" ${filters.status === 'progress' ? 'selected' : ''}>In Progress</option>
                                </select>
                            </div>
                            <button onclick="exportCSV()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 flex items-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                                </svg>
                                Export to CSV
                            </button>
                        </div>

                        <!-- Table -->
                        <div class="bg-white rounded-lg shadow-sm p-6">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-xl font-semibold text-gray-800">📋 Recent Maintenance Tickets</h2>
                                <span class="text-sm text-gray-600">Showing latest 25 of ${filteredTickets.length} tickets</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full min-w-max">
                                    <thead>
                                        <tr class="border-b-2 border-gray-200">
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Date</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Time</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">MRF No</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Villa/Flat</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">System</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Details</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Intimated By</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Action Taker</th>
                                            <th class="text-left py-3 px-4 font-semibold text-gray-700">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${recentTickets.length === 0 ? `
                                            <tr>
                                                <td colspan="9" class="text-center py-8 text-gray-500">
                                                    No tickets found. Try adjusting your filters.
                                                </td>
                                            </tr>
                                        ` : recentTickets.map(ticket => `
                                            <tr class="border-b border-gray-100 hover:bg-gray-50">
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.date}</td>
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.time}</td>
                                                <td class="py-3 px-4 font-medium text-blue-600">${ticket.mrfNo}</td>
                                                <td class="py-3 px-4 text-gray-700">${ticket.villa}</td>
                                                <td class="py-3 px-4">
                                                    <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm">
                                                        ${ticket.system}
                                                    </span>
                                                </td>
                                                <td class="py-3 px-4 text-gray-700 max-w-xs truncate" title="${ticket.details}">
                                                    ${ticket.details}
                                                </td>
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.intimatedBy || '-'}</td>
                                                <td class="py-3 px-4 text-sm text-gray-700">${ticket.actionTaker || '-'}</td>
                                                <td class="py-3 px-4">
                                                    <span class="px-2 py-1 rounded text-sm font-medium whitespace-nowrap ${
                                                        ticket.status.toLowerCase().includes('completed') ? 'bg-green-100 text-green-800' :
                                                        ticket.status.toLowerCase().includes('progress') ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }">
                                                        ${ticket.status || 'Pending'}
                                                    </span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('app').innerHTML = html;
        }

        // Load data on page load
        loadData();
    </script>
</body>
</html>
