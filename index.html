<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.5.0/dist/Recharts.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BarChart, Bar, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // SVG Icons as components
        const SearchIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const FilterIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
            </svg>
        );

        const DownloadIcon = () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        );

        const RefreshIcon = ({ loading }) => (
            <svg className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        );

        const VillaMaintenanceDashboard = () => {
            const [tickets, setTickets] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [filters, setFilters] = useState({
                villa: '',
                category: '',
                status: '',
                complaintNumber: ''
            });

            // IMPORTANT: Replace with your Google Sheet ID
            const SHEET_ID = '1T8p2ojn8W6jmC5rTAcZ7xxE7MKy-n9fa5ke4QFzVQY4';

            const loadData = async () => {
                setLoading(true);
                setError(null);
                
                try {
                    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;
                    
                    const response = await fetch(url);
                    const csvText = await response.text();
                    
                    // Parse CSV
                    const lines = csvText.split('\n');
                    const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
                    const rows = lines.slice(1).filter(line => line.trim());
                    
                    const formattedTickets = rows.map((row, index) => {
                        const values = [];
                        let current = '';
                        let inQuotes = false;
                        
                        for (let char of row) {
                            if (char === '"') {
                                inQuotes = !inQuotes;
                            } else if (char === ',' && !inQuotes) {
                                values.push(current.trim().replace(/"/g, ''));
                                current = '';
                            } else {
                                current += char;
                            }
                        }
                        values.push(current.trim().replace(/"/g, ''));
                        
                        return {
                            id: index + 1,
                            complaintNumber: values[0] || '',
                            date: values[1] || '',
                            villa: values[2] || '',
                            category: values[3] || '',
                            description: values[4] || '',
                            status: values[5] || 'Pending',
                            assignedTo: values[6] || '',
                            completionDate: values[7] || ''
                        };
                    });
                    
                    setTickets(formattedTickets.filter(t => t.complaintNumber));
                } catch (err) {
                    setError('Failed to load data. Make sure your Google Sheet is shared as "Anyone with the link can view"');
                    console.error(err);
                    
                    // Demo data
                    setTickets([
                        { id: 1, complaintNumber: 'C001', date: '2024-01-15', villa: 'Villa A1', category: 'Plumbing', description: 'Leaking faucet', status: 'Completed', assignedTo: 'John', completionDate: '2024-01-16' },
                        { id: 2, complaintNumber: 'C002', date: '2024-01-16', villa: 'Villa B2', category: 'Electrical', description: 'Light not working', status: 'Pending', assignedTo: 'Mike', completionDate: '' },
                        { id: 3, complaintNumber: 'C003', date: '2024-01-17', villa: 'Villa A1', category: 'AC', description: 'AC not cooling', status: 'In Progress', assignedTo: 'Sarah', completionDate: '' },
                        { id: 4, complaintNumber: 'C004', date: '2024-01-18', villa: 'Villa C3', category: 'Plumbing', description: 'Blocked drain', status: 'Pending', assignedTo: '', completionDate: '' },
                        { id: 5, complaintNumber: 'C005', date: '2024-01-19', villa: 'Villa B2', category: 'Painting', description: 'Wall damage', status: 'Completed', assignedTo: 'Tom', completionDate: '2024-01-20' },
                    ]);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadData();
            }, []);

            const filteredTickets = tickets.filter(ticket => {
                return (
                    (filters.villa === '' || ticket.villa.toLowerCase().includes(filters.villa.toLowerCase())) &&
                    (filters.category === '' || ticket.category.toLowerCase().includes(filters.category.toLowerCase())) &&
                    (filters.status === '' || ticket.status === filters.status) &&
                    (filters.complaintNumber === '' || ticket.complaintNumber.toLowerCase().includes(filters.complaintNumber.toLowerCase()))
                );
            });

            // Analytics data
            const categoryData = Object.entries(
                filteredTickets.reduce((acc, ticket) => {
                    acc[ticket.category] = (acc[ticket.category] || 0) + 1;
                    return acc;
                }, {})
            ).map(([name, value]) => ({ name, value }));

            const statusData = Object.entries(
                filteredTickets.reduce((acc, ticket) => {
                    acc[ticket.status] = (acc[ticket.status] || 0) + 1;
                    return acc;
                }, {})
            ).map(([name, value]) => ({ name, value }));

            const villaData = Object.entries(
                filteredTickets.reduce((acc, ticket) => {
                    acc[ticket.villa] = (acc[ticket.villa] || 0) + 1;
                    return acc;
                }, {})
            ).map(([name, value]) => ({ name, value }));

            const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

            const exportToCSV = () => {
                const headers = ['Complaint#', 'Date', 'Villa', 'Category', 'Description', 'Status', 'Assigned To', 'Completion Date'];
                const csv = [
                    headers.join(','),
                    ...filteredTickets.map(t => [
                        t.complaintNumber, t.date, t.villa, t.category, 
                        `"${t.description}"`, t.status, t.assignedTo, t.completionDate
                    ].join(','))
                ].join('\n');
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'maintenance_report.csv';
                a.click();
            };

            return (
                <div className="min-h-screen bg-gray-50 p-6">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div className="flex justify-between items-center mb-4">
                                <h1 className="text-3xl font-bold text-gray-800">Villa Maintenance Dashboard</h1>
                                <button
                                    onClick={loadData}
                                    disabled={loading}
                                    className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50"
                                >
                                    <RefreshIcon loading={loading} />
                                    Refresh
                                </button>
                            </div>

                            {error && (
                                <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
                                    <p className="text-yellow-800 text-sm">{error}</p>
                                    <p className="text-yellow-700 text-xs mt-2">
                                        Make sure your Google Sheet is shared with "Anyone with the link can view" permissions.
                                    </p>
                                </div>
                            )}

                            {/* Summary Cards */}
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div className="bg-blue-50 rounded-lg p-4">
                                    <p className="text-blue-600 text-sm font-medium">Total Tickets</p>
                                    <p className="text-3xl font-bold text-blue-900">{filteredTickets.length}</p>
                                </div>
                                <div className="bg-yellow-50 rounded-lg p-4">
                                    <p className="text-yellow-600 text-sm font-medium">Pending</p>
                                    <p className="text-3xl font-bold text-yellow-900">
                                        {filteredTickets.filter(t => t.status === 'Pending').length}
                                    </p>
                                </div>
                                <div className="bg-green-50 rounded-lg p-4">
                                    <p className="text-green-600 text-sm font-medium">Completed</p>
                                    <p className="text-3xl font-bold text-green-900">
                                        {filteredTickets.filter(t => t.status === 'Completed').length}
                                    </p>
                                </div>
                                <div className="bg-purple-50 rounded-lg p-4">
                                    <p className="text-purple-600 text-sm font-medium">In Progress</p>
                                    <p className="text-3xl font-bold text-purple-900">
                                        {filteredTickets.filter(t => t.status === 'In Progress').length}
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Filters */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div className="flex items-center gap-2 mb-4">
                                <FilterIcon />
                                <h2 className="text-xl font-semibold text-gray-800">Filters</h2>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <input
                                    type="text"
                                    placeholder="Search by Complaint #"
                                    value={filters.complaintNumber}
                                    onChange={(e) => setFilters({...filters, complaintNumber: e.target.value})}
                                    className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                                <input
                                    type="text"
                                    placeholder="Search by Villa"
                                    value={filters.villa}
                                    onChange={(e) => setFilters({...filters, villa: e.target.value})}
                                    className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                                <input
                                    type="text"
                                    placeholder="Search by Category"
                                    value={filters.category}
                                    onChange={(e) => setFilters({...filters, category: e.target.value})}
                                    className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                />
                                <select
                                    value={filters.status}
                                    onChange={(e) => setFilters({...filters, status: e.target.value})}
                                    className="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                >
                                    <option value="">All Status</option>
                                    <option value="Pending">Pending</option>
                                    <option value="In Progress">In Progress</option>
                                    <option value="Completed">Completed</option>
                                </select>
                            </div>
                            <button
                                onClick={exportToCSV}
                                className="mt-4 flex items-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
                            >
                                <DownloadIcon />
                                Export to CSV
                            </button>
                        </div>

                        {/* Charts */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <h3 className="text-lg font-semibold text-gray-800 mb-4">Tickets by Category</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <BarChart data={categoryData}>
                                        <CartesianGrid strokeDasharray="3 3" />
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip />
                                        <Bar dataKey="value" fill="#3b82f6" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-white rounded-lg shadow-sm p-6">
                                <h3 className="text-lg font-semibold text-gray-800 mb-4">Status Distribution</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <PieChart>
                                        <Pie
                                            data={statusData}
                                            cx="50%"
                                            cy="50%"
                                            labelLine={false}
                                            label={({name, percent}) => `${name}: ${(percent * 100).toFixed(0)}%`}
                                            outerRadius={100}
                                            fill="#8884d8"
                                            dataKey="value"
                                        >
                                            {statusData.map((entry, index) => (
                                                <Cell key={`cell-${index}`} fill={COLORS[index % COLORS.length]} />
                                            ))}
                                        </Pie>
                                        <Tooltip />
                                    </PieChart>
                                </ResponsiveContainer>
                            </div>

                            <div className="bg-white rounded-lg shadow-sm p-6 lg:col-span-2">
                                <h3 className="text-lg font-semibold text-gray-800 mb-4">Tickets by Villa</h3>
                                <ResponsiveContainer width="100%" height={300}>
                                    <BarChart data={villaData}>
                                        <CartesianGrid strokeDasharray="3 3" />
                                        <XAxis dataKey="name" />
                                        <YAxis />
                                        <Tooltip />
                                        <Bar dataKey="value" fill="#10b981" />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </div>

                        {/* Tickets Table */}
                        <div className="bg-white rounded-lg shadow-sm p-6">
                            <h2 className="text-xl font-semibold text-gray-800 mb-4">Maintenance Tickets</h2>
                            <div className="overflow-x-auto">
                                <table className="w-full">
                                    <thead>
                                        <tr className="border-b border-gray-200">
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Complaint #</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Date</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Villa</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Category</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Description</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Status</th>
                                            <th className="text-left py-3 px-4 font-semibold text-gray-700">Assigned To</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredTickets.map((ticket) => (
                                            <tr key={ticket.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                <td className="py-3 px-4 font-medium text-blue-600">{ticket.complaintNumber}</td>
                                                <td className="py-3 px-4 text-gray-700">{ticket.date}</td>
                                                <td className="py-3 px-4 text-gray-700">{ticket.villa}</td>
                                                <td className="py-3 px-4">
                                                    <span className="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm">
                                                        {ticket.category}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-4 text-gray-700 max-w-xs truncate">{ticket.description}</td>
                                                <td className="py-3 px-4">
                                                    <span className={`px-2 py-1 rounded text-sm font-medium ${
                                                        ticket.status === 'Completed' ? 'bg-green-100 text-green-800' :
                                                        ticket.status === 'In Progress' ? 'bg-yellow-100 text-yellow-800' :
                                                        'bg-gray-100 text-gray-800'
                                                    }`}>
                                                        {ticket.status}
                                                    </span>
                                                </td>
                                                <td className="py-3 px-4 text-gray-700">{ticket.assignedTo || '-'}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<VillaMaintenanceDashboard />);
    </script>
</body>
</html>
