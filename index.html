<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villa Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="app">
        <div class="min-h-screen flex items-center justify-center">
            <div class="text-center">
                <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-blue-600 mx-auto mb-4"></div>
                <p class="text-xl text-gray-600">Loading...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const SHEET_ID = '1T8p2ojn8W6jmC5rTAcZ7xxE7MKy-n9fa5ke4QFzVQY4';
        const GID = '931447490';
        const SITE_PASSWORD = 'villa2025';

        let isAuthenticated = false;
        let allTickets = [];
        let filteredTickets = [];
        let filters = { mrfNo: '', villa: '', system: '', status: '' };
        let chatHistory = [];
        let showChat = false;
        let showPassword = false;

        // Check if already authenticated
        if (sessionStorage.getItem('auth') === 'true') {
            isAuthenticated = true;
            loadData();
        } else {
            showLogin();
        }

        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="min-h-screen bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
                        <div class="text-center mb-8">
                            <div class="bg-gradient-to-br from-blue-600 to-purple-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                            <h1 class="text-3xl font-bold text-gray-800">🏢 Villa Maintenance</h1>
                            <p class="text-gray-600 mt-2">Secure Access Required</p>
                        </div>
                        <div class="space-y-4">
                            <div class="relative">
                                <input
                                    id="pass"
                                    type="password"
                                    placeholder="Enter password"
                                    class="w-full px-4 py-3 pr-12 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    onkeypress="if(event.key==='Enter') login()"
                                />
                                <button onclick="togglePass()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500">
                                    <svg id="eye" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                            <div id="err" class="hidden bg-red-50 border-l-4 border-red-500 p-3 rounded text-sm text-red-700"></div>
                            <button onclick="login()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white py-3 rounded-lg font-semibold hover:opacity-90">
                                🔓 Unlock Dashboard
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 text-center mt-6">🔒 Authorized personnel only</p>
                    </div>
                </div>
            `;
            document.getElementById('pass').focus();
        }

        function togglePass() {
            const input = document.getElementById('pass');
            showPassword = !showPassword;
            input.type = showPassword ? 'text' : 'password';
        }

        function login() {
            const pass = document.getElementById('pass').value.trim();
            const err = document.getElementById('err');
            
            if (pass === SITE_PASSWORD) {
                isAuthenticated = true;
                sessionStorage.setItem('auth', 'true');
                loadData();
            } else {
                err.textContent = '❌ Incorrect password';
                err.classList.remove('hidden');
                document.getElementById('pass').value = '';
            }
        }

        function logout() {
            isAuthenticated = false;
            sessionStorage.removeItem('auth');
            location.reload();
        }

        async function loadData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
                const res = await fetch(url);
                const csv = await res.text();
                const lines = csv.split('\n').filter(l => l.trim());
                
                allTickets = [];
                for (let i = 1; i < lines.length; i++) {
                    const vals = parseCSVLine(lines[i]);
                    if (vals,[object Object],) {
                        allTickets.push({
                            date: vals,[object Object], || '', time: vals,[object Object], || '', mrfNo: vals,[object Object], || '',
                            villa: vals,[object Object], || '', system: vals,[object Object], || '', receptionist: vals,[object Object], || '',
                            details: vals,[object Object], || '', intimatedBy: vals,[object Object], || '', actionTaker: vals,[object Object], || '',
                            actionDate: vals,[object Object], || '', status: vals,[object Object], || 'Pending'
                        });
                    }
                }
                applyFilters();
                render();
            } catch(e) {
                alert('Error loading data: ' + e.message);
            }
        }

        function parseCSVLine(line) {
            const vals = [];
            let cur = '', inQ = false;
            for (let c of line) {
                if (c === '"') inQ = !inQ;
                else if (c === ',' && !inQ) { vals.push(cur.trim().replace(/^"|"$/g, '')); cur = ''; }
                else cur += c;
            }
            vals.push(cur.trim().replace(/^"|"$/g, ''));
            return vals;
        }

        function applyFilters() {
            filteredTickets = allTickets.filter(t => {
                const vm = !filters.villa || t.villa.toLowerCase() === filters.villa.toLowerCase();
                return vm &&
                    (!filters.mrfNo || t.mrfNo.toLowerCase().includes(filters.mrfNo.toLowerCase())) &&
                    (!filters.system || t.system.toLowerCase().includes(filters.system.toLowerCase())) &&
                    (!filters.status || t.status.toLowerCase().includes(filters.status.toLowerCase()));
            });
        }

        function updateFilter(k, v) {
            filters[k] = v;
            applyFilters();
            render();
        }

        function resetDashboard() {
            filters = { mrfNo: '', villa: '', system: '', status: '' };
            applyFilters();
            render();
        }

        function exportCSV() {
            const h = ['Date','Time','MRF No','Villa','System','Receptionist','Details','Intimated By','Action Taker','Action Date','Status'];
            const rows = filteredTickets.map(t => [t.date,t.time,t.mrfNo,t.villa,t.system,t.receptionist,`"${t.details}"`,t.intimatedBy,t.actionTaker,t.actionDate,t.status].join(','));
            const csv = [h.join(','), ...rows].join('\n');
            const blob = new Blob([csv], {type:'text/csv'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'maintenance_report.csv';
            a.click();
        }

        function getSystemPending() {
            const pending = allTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending'));
            const cfg = {
                'AC': {color:'blue', icon:'❄️'}, 'Electrical': {color:'yellow', icon:'⚡'},
                'Plumbing': {color:'cyan', icon:'🚰'}, 'Carpentry': {color:'amber', icon:'🔨'},
                'Painting': {color:'purple', icon:'🎨'}, 'Mason': {color:'gray', icon:'🧱'}
            };
            return Object.keys(cfg).map(s => ({
                system: s, count: pending.filter(t => t.system === s).length, ...cfg[s]
            }));
        }

        function toggleChat() {
            showChat = !showChat;
            render();
        }

        function sendChat() {
            const inp = document.getElementById('chatInput');
            const q = inp.value.trim();
            if (!q) return;
            chatHistory.push({role:'user', content:q});
            inp.value = '';
            
            // Show typing indicator
            chatHistory.push({role:'assistant', content:'⏳ Analyzing...'});
            render();
            
            setTimeout(() => {
                chatHistory.pop(); // Remove typing indicator
                const ans = getSmartAnswer(q);
                chatHistory.push({role:'assistant', content:ans});
                render();
                setTimeout(() => {
                    const box = document.querySelector('.overflow-y-auto');
                    if (box) box.scrollTop = box.scrollHeight;
                }, 50);
            }, 300);
        }

        function getSmartAnswer(question) {
            const q = question.toLowerCase().trim()
                .replace(/villa no\.?/gi, 'villa')
                .replace(/flat no\.?/gi, 'flat')
                .replace(/\s+/g, ' ')
                .replace(/how many times?/gi, 'how many')
                .replace(/how much/gi, 'how many')
                .replace(/show me/gi, '')
                .replace(/tell me/gi, '');
            
            console.log('Chat query:', q);
            
            // Parse date helper
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            
            function parseDate(dateStr) {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const months = {
                        'january': 0, 'february': 1, 'march': 2, 'april': 3, 'may': 4, 'june': 5,
                        'july': 6, 'august': 7, 'september': 8, 'october': 9, 'november': 10, 'december': 11
                    };
                    const day = parseInt(parts,[object Object],);
                    const month = months[parts,[object Object],toLowerCase()];
                    const year = parseInt(parts,[object Object],);
                    if (day && month !== undefined && year) {
                        return new Date(year, month, day);
                    }
                }
                return null;
            }
            
            // Extract villa/flat
            const villaMatch = q.match(/villa\s*(\d+)/i);
            const flatMatch = q.match(/flat\s*(\d+)/i);
            let villa = null;
            if (villaMatch) villa = `Villa ${villaMatch,[object Object],}`;
            else if (flatMatch) villa = `Flat ${flatMatch,[object Object],}`;
            
            // Extract system
            const systems = ['ac', 'electrical', 'plumbing', 'carpentry', 'painting', 'mason'];
            const system = systems.find(s => q.includes(s));
            
            // Detail keywords (CHECK MULTI-WORD PHRASES FIRST!)
            let foundItem = null;
            let searchKeys = [];
            
            // Multi-word phrases (check these first!)
            if ((q.includes('interlock') && (q.includes('paint') || q.includes('painting')))) {
                foundItem = 'interlock paint';
                searchKeys = ['interlock paint', 'interlock need to paint', 'interlock painting'];
            } else if (q.includes('door') && q.includes('lock')) {
                foundItem = 'door lock';
                searchKeys = ['door lock', 'door locker'];
            } else if ((q.includes('washing') && q.includes('machine')) || q.includes('washer')) {
                foundItem = 'washing machine';
                searchKeys = ['washing machine', 'washer'];
            } else if ((q.includes('water') && q.includes('heater')) || q.includes('geyser')) {
                foundItem = 'water heater';
                searchKeys = ['water heater', 'heater', 'geyser'];
            } else if (q.includes('dishwasher')) {
                foundItem = 'dishwasher';
                searchKeys = ['dishwasher', 'dish washer'];
            } else {
                // Single word items
                const singleItems = {
                    'fridge': ['fridge', 'refrigerator'],
                    'toilet': ['toilet', 'wc', 'commode'],
                    'sink': ['sink', 'basin'],
                    'shower': ['shower'],
                    'tap': ['tap', 'faucet'],
                    'door': ['door'],
                    'window': ['window'],
                    'lock': ['lock', 'locker'],
                    'paint': ['paint', 'painting'],
                    'tile': ['tile', 'tiles'],
                    'ceiling': ['ceiling'],
                    'wall': ['wall'],
                    'floor': ['floor'],
                    'light': ['light', 'bulb', 'lamp'],
                    'fan': ['fan'],
                    'switch': ['switch', 'socket'],
                    'drain': ['drain', 'drainage', 'clogged', 'blocked'],
                    'leak': ['leak', 'leaking', 'leakage']
                };
                
                for (const [item, keywords] of Object.entries(singleItems)) {
                    if (keywords.some(kw => q.includes(kw))) {
                        foundItem = item;
                        searchKeys = keywords;
                        break;
                    }
                }
            }
            
            // DETAIL-BASED SEARCH
            if (foundItem && searchKeys.length > 0) {
                console.log('Searching for item:', foundItem, 'with keys:', searchKeys);
                const filtered = allTickets.filter(t => 
                    searchKeys.some(kw => t.details.toLowerCase().includes(kw.toLowerCase()))
                );
                
                console.log('Found', filtered.length, 'matching tickets');
                
                if (filtered.length === 0) {
                    return `❌ No complaints found for "${foundItem}".`;
                }
                
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = filtered.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                const locations = {};
                filtered.forEach(t => locations[t.villa] = (locations[t.villa] || 0) + 1);
                const sortedLoc = Object.entries(locations).sort((a,b) => b,[object Object], - a,[object Object],);
                
                const sysCounts = {};
                filtered.forEach(t => sysCounts[t.system] = (sysCounts[t.system] || 0) + 1);
                
                let result = `🔍 ${foundItem.toUpperCase()} Search Results:\n\n`;
                result += `📊 Total: ${filtered.length} complaints\n`;
                result += `✅ Completed: ${completed}\n`;
                result += `⏳ Pending: ${pending}\n\n`;
                result += `🏠 Locations (${sortedLoc.length}):\n`;
                result += sortedLoc.slice(0,10).map(([v,c],i) => `${i+1}. ${v}: ${c} complaint${c>1?'s':''}`).join('\n');
                if (sortedLoc.length > 10) result += `\n...and ${sortedLoc.length - 10} more`;
                result += `\n\n🔧 Systems:\n${Object.entries(sysCounts).sort((a,b)=>b,[object Object],-a,[object Object],).map(([s,c]) => `• ${s}: ${c}`).join('\n')}`;
                result += `\n\n📋 Recent:\n${filtered.slice(-3).map(t => `• ${t.villa} (${t.date}): ${t.details.substring(0,60)}${t.details.length>60?'...':''}`).join('\n')}`;
                
                return result;
            }
            
            // YESTERDAY
            if (q.includes('yesterday')) {
                const yTickets = allTickets.filter(t => {
                    const d = parseDate(t.date);
                    return d && d.toDateString() === yesterday.toDateString();
                });
                
                if (system) {
                    const sysTickets = yTickets.filter(t => t.system.toLowerCase().includes(system));
                    return `📅 Yesterday:\n\n${system.toUpperCase()}: ${sysTickets.length} complaint${sysTickets.length!==1?'s':''}\n\n${sysTickets.length > 0 ? 'Details:\n' + sysTickets.map(t => `• ${t.villa}: ${t.details}`).join('\n') : ''}`;
                }
                return `📅 Yesterday: ${yTickets.length} total complaints`;
            }
            
            // TODAY
            if (q.includes('today')) {
                const tTickets = allTickets.filter(t => {
                    const d = parseDate(t.date);
                    return d && d.toDateString() === today.toDateString();
                });
                
                if (system) {
                    const sysTickets = tTickets.filter(t => t.system.toLowerCase().includes(system));
                    return `📅 Today:\n\n${system.toUpperCase()}: ${sysTickets.length} complaint${sysTickets.length!==1?'s':''}\n\n${sysTickets.length > 0 ? sysTickets.map(t => `• ${t.villa}: ${t.details}`).join('\n') : 'No issues reported yet'}`;
                }
                return `📅 Today: ${tTickets.length} total complaints`;
            }
            
            // TOP/MOST/WHICH VILLA
            if ((q.includes('top') || q.includes('most') || q.includes('which villa') || q.includes('what villa')) && (q.includes('villa') || q.includes('location'))) {
                const counts = {};
                allTickets.forEach(t => {
                    if (!system || t.system.toLowerCase().includes(system)) {
                        counts[t.villa] = (counts[t.villa] || 0) + 1;
                    }
                });
                const sorted = Object.entries(counts).sort((a,b) => b,[object Object], - a,[object Object],).slice(0,10);
                return `🏆 Top Locations ${system?'('+system.toUpperCase()+')':''}:\n\n${sorted.map(([v,c],i) => `${i+1}. ${v}: ${c} complaint${c>1?'s':''}`).join('\n')}\n\n${sorted,[object Object], ? sorted,[object Object],[object Object], + ' has the most with ' + sorted,[object Object],[object Object], + ' complaints' : ''}`;
            }
            
            // TECHNICIAN
            if (q.includes('technician') || q.includes('action taker') || q.includes('assigned') || q.includes('busiest')) {
                const counts = {};
                allTickets.forEach(t => {
                    if (t.actionTaker && t.actionTaker.trim()) {
                        counts[t.actionTaker] = (counts[t.actionTaker] || 0) + 1;
                    }
                });
                const sorted = Object.entries(counts).sort((a,b) => b,[object Object], - a,[object Object],);
                return `👷 Technician Workload:\n\n${sorted.map(([tech,c],i) => `${i+1}. ${tech}: ${c} task${c>1?'s':''}`).join('\n')}\n\nTotal technicians: ${sorted.length}`;
            }
            
            // COMPARE VILLAS
            if (q.includes('compare')) {
                const villaMatches = q.match(/villa\s*(\d+)/gi) || q.match(/flat\s*(\d+)/gi);
                if (villaMatches && villaMatches.length >= 2) {
                    const v1 = villaMatches,[object Object],replace(/villa\s*/i, 'Villa ').replace(/flat\s*/i, 'Flat ');
                    const v2 = villaMatches,[object Object],replace(/villa\s*/i, 'Villa ').replace(/flat\s*/i, 'Flat ');
                    const t1 = allTickets.filter(t => t.villa.toLowerCase() === v1.toLowerCase());
                    const t2 = allTickets.filter(t => t.villa.toLowerCase() === v2.toLowerCase());
                    const p1 = t1.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                    const p2 = t2.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                    return `⚖️ Comparison:\n\n${v1}:\n• Total: ${t1.length}\n• Pending: ${p1}\n• Completed: ${t1.length - p1}\n\n${v2}:\n• Total: ${t2.length}\n• Pending: ${p2}\n• Completed: ${t2.length - p2}`;
                }
            }
            
            // VILLA + PENDING
            if (villa && (q.includes('pending') || q.includes('open') || q.includes('issue'))) {
                const tickets = allTickets.filter(t => t.villa.toLowerCase() === villa.toLowerCase());
                const pending = tickets.filter(t => !t.status || t.status.toLowerCase().includes('pending') || t.status.trim() === '');
                
                if (pending.length > 0) {
                    const sys = {};
                    pending.forEach(t => sys[t.system] = (sys[t.system] || 0) + 1);
                    return `⚠️ ${villa} - Pending Issues (${pending.length}):\n\n${Object.entries(sys).map(([s,c]) => `• ${s}: ${c}`).join('\n')}\n\nRecent:\n${pending.slice(-3).map(t => `• ${t.system}: ${t.details} (${t.mrfNo})`).join('\n')}`;
                }
                return `✅ Great! ${villa} has no pending complaints.`;
            }
            
            // VILLA + SYSTEM
            if (villa && system) {
                const filtered = allTickets.filter(t => 
                    t.villa.toLowerCase() === villa.toLowerCase() && 
                    t.system.toLowerCase().includes(system)
                );
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = filtered.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                return `🏠 ${villa} - ${system.toUpperCase()}:\n\n📊 Total: ${filtered.length} complaint${filtered.length!==1?'s':''}\n✅ Completed: ${completed}\n⏳ Pending: ${pending}\n\n${filtered.length > 0 ? 'Recent:\n' + filtered.slice(-3).map(t => `• ${t.date}: ${t.details} (${t.status})`).join('\n') : 'No complaints found'}`;
            }
            
            // JUST VILLA
            if (villa) {
                const tickets = allTickets.filter(t => t.villa.toLowerCase() === villa.toLowerCase());
                const sys = {};
                tickets.forEach(t => sys[t.system] = (sys[t.system] || 0) + 1);
                const pending = tickets.filter(t => !t.status || t.status.toLowerCase().includes('pending'));
                
                return `🏠 ${villa} Summary:\n\n📊 Total: ${tickets.length} complaint${tickets.length!==1?'s':''}\n⚠️ Pending: ${pending.length}\n\nBy System:\n${Object.entries(sys).sort((a,b)=>b,[object Object],-a,[object Object],).map(([s,c]) => `• ${s}: ${c}`).join('\n')}\n\n${pending.length > 0 ? 'Pending:\n' + pending.slice(-3).map(t => `• ${t.system}: ${t.details}`).join('\n') : '✅ All resolved!'}`;
            }
            
            // JUST SYSTEM
            if (system) {
                const filtered = allTickets.filter(t => t.system.toLowerCase().includes(system));
                const pending = filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = filtered.filter(t => t.status.toLowerCase().includes('completed')).length;
                
                const counts = {};
                filtered.forEach(t => counts[t.villa] = (counts[t.villa] || 0) + 1);
                const top = Object.entries(counts).sort((a,b) => b,[object Object], - a,[object Object],).slice(0,5);
                
                return `🔧 ${system.toUpperCase()} Report:\n\n📊 Total: ${filtered.length}\n✅ Completed: ${completed}\n⏳ Pending: ${pending}\n\nTop Locations:\n${top.map(([v,c],i) => `${i+1}. ${v}: ${c}`).join('\n')}\n\n${pending > 0 ? 'Recent Pending:\n' + filtered.filter(t => !t.status || t.status.toLowerCase().includes('pending')).slice(-3).map(t => `• ${t.villa}: ${t.details}`).join('\n') : ''}`;
            }
            
            // TOTAL/SUMMARY
            if (q.includes('total') || q.includes('summary') || q.includes('overall') || q.includes('how many complaint')) {
                const pending = allTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length;
                const completed = allTickets.filter(t => t.status.toLowerCase().includes('completed')).length;
                const sys = {};
                allTickets.forEach(t => sys[t.system] = (sys[t.system] || 0) + 1);
                
                return `📊 Overall Summary:\n\n🎫 Total: ${allTickets.length} tickets\n⏳ Pending: ${pending}\n✅ Completed: ${completed}\n\nBy System:\n${Object.entries(sys).sort((a,b) => b,[object Object], - a,[object Object],).map(([s,c]) => `• ${s}: ${c}`).join('\n')}\n\n💡 Ask about specific villas, systems, or items!`;
            }
            
            // DEFAULT HELP
            return `I can answer questions like:\n\n📅 Time-based:\n• "Yesterday AC complaints?"\n• "Today's issues?"\n\n🏠 Location:\n• "Villa 130 AC problems?"\n• "Flat 511 pending?"\n• "Which villa has most issues?"\n\n🔍 Item search:\n• "Washing machine complaints?"\n• "Interlock paint requests?"\n• "Water heater issues?"\n• "Door lock problems?"\n\n🔧 System:\n• "Plumbing report?"\n• "AC complaints?"\n\n👷 Other:\n• "Who is busiest technician?"\n• "Compare Villa 130 and Villa 95"\n\n💡 Just ask naturally!`;
        }

        function render() {
            if (!isAuthenticated) { showLogin(); return; }
            
            console.log('Rendering dashboard...');
            
            const stats = {
                total: filteredTickets.length,
                pending: filteredTickets.filter(t => !t.status || t.status.toLowerCase().includes('pending')).length,
                completed: filteredTickets.filter(t => t.status.toLowerCase().includes('completed')).length,
                progress: filteredTickets.filter(t => t.status.toLowerCase().includes('progress')).length
            };
            
            const sysPending = getSystemPending();
            const systems = [...new Set(allTickets.map(t => t.system))];
            const recent = [...filteredTickets].reverse().slice(0,25);

            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear first
            
            // Create main container
            const container = document.createElement('div');
            container.className = 'min-h-screen p-4 md:p-6';
            container.innerHTML = `
                <div class="max-w-7xl mx-auto">
                    <!-- Header -->
                    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                        <div class="flex justify-between items-center mb-4">
                            <div><h1 class="text-2xl md:text-3xl font-bold">🏢 Villa Maintenance Dashboard</h1>
                            <p class="text-gray-600">Track and manage - 2025</p></div>
                            <div class="flex gap-2">
                                <button onclick="resetDashboard()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700">🏠</button>
                                <button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">🔄</button>
                                <button onclick="logout()" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700">🚪</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-blue-50 rounded-lg p-4"><p class="text-blue-600 text-sm font-medium">Total</p><p class="text-3xl font-bold">${stats.total}</p></div>
                            <div class="bg-yellow-50 rounded-lg p-4"><p class="text-yellow-600 text-sm font-medium">Pending</p><p class="text-3xl font-bold">${stats.pending}</p></div>
                            <div class="bg-green-50 rounded-lg p-4"><p class="text-green-600 text-sm font-medium">Completed</p><p class="text-3xl font-bold">${stats.completed}</p></div>
                            <div class="bg-purple-50 rounded-lg p-4"><p class="text-purple-600 text-sm font-medium">Progress</p><p class="text-3xl font-bold">${stats.progress}</p></div>
                        </div>
                    </div>

                    <!-- System Summary -->
                    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                        <h2 class="text-xl font-semibold mb-4">⚙️ Pending by System</h2>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4" id="sysGrid"></div>
                    </div>

                    <!-- Filters -->
                    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                        <h2 class="text-xl font-semibold mb-4">🔍 Search</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <input type="text" placeholder="MRF No" value="${filters.mrfNo}" onchange="updateFilter('mrfNo', this.value)" class="px-4 py-2 border rounded-lg"/>
                            <input type="text" placeholder="Villa" value="${filters.villa}" onchange="updateFilter('villa', this.value)" class="px-4 py-2 border rounded-lg"/>
                            <select onchange="updateFilter('system', this.value)" class="px-4 py-2 border rounded-lg">
                                <option value="">All Systems</option>
                                ${systems.map(s => `<option value="${s}" ${filters.system===s?'selected':''}>${s}</option>`).join('')}
                            </select>
                            <select onchange="updateFilter('status', this.value)" class="px-4 py-2 border rounded-lg">
                                <option value="">All</option>
                                <option value="pending">Pending</option>
                                <option value="progress">Progress</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <button onclick="exportCSV()" class="mt-4 bg-green-600 text-white px-4 py-2 rounded-lg">📥 Export</button>
                    </div>

                    <!-- Table -->
                    <div class="bg-white rounded-lg shadow-sm p-6">
                        <div class="flex justify-between mb-4">
                            <h2 class="text-xl font-semibold">📋 Recent (25)</h2>
                            <span class="text-sm text-gray-600">${filteredTickets.length} total</span>
                        </div>
                        <div class="overflow-x-auto" id="ticketTable"></div>
                    </div>
                </div>
            `;
            
            app.appendChild(container);
            
            // Build system grid separately
            const sysGrid = document.getElementById('sysGrid');
            sysPending.forEach(s => {
                const div = document.createElement('div');
                div.className = `bg-${s.color}-50 rounded-lg p-4 border-l-4 border-${s.color}-500 cursor-pointer hover:shadow-md`;
                div.onclick = () => { updateFilter('system', s.system); updateFilter('status', 'pending'); };
                div.innerHTML = `<div class="text-2xl mb-2">${s.icon}</div><p class="text-sm font-semibold">${s.system}</p><p class="text-3xl font-bold">${s.count}</p>`;
                sysGrid.appendChild(div);
            });
            
            // Build table separately
            const tableDiv = document.getElementById('ticketTable');
            const table = document.createElement('table');
            table.className = 'w-full';
            table.innerHTML = `
                <thead><tr class="border-b-2">
                    <th class="text-left py-3 px-4">Date</th><th class="text-left py-3 px-4">Time</th><th class="text-left py-3 px-4">MRF</th>
                    <th class="text-left py-3 px-4">Villa</th><th class="text-left py-3 px-4">System</th><th class="text-left py-3 px-4">Details</th>
                    <th class="text-left py-3 px-4">Status</th>
                </tr></thead>
                <tbody id="tbody"></tbody>
            `;
            tableDiv.appendChild(table);
            
            const tbody = document.getElementById('tbody');
            recent.forEach(t => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="py-3 px-4 text-sm">${t.date}</td>
                    <td class="py-3 px-4 text-sm">${t.time}</td>
                    <td class="py-3 px-4 font-medium text-blue-600">${t.mrfNo}</td>
                    <td class="py-3 px-4">${t.villa}</td>
                    <td class="py-3 px-4"><span class="px-2 py-1 bg-blue-100 text-blue-800 rounded text-sm">${t.system}</span></td>
                    <td class="py-3 px-4 max-w-xs truncate">${t.details}</td>
                    <td class="py-3 px-4"><span class="px-2 py-1 rounded text-sm ${
                        t.status.toLowerCase().includes('completed') ? 'bg-green-100 text-green-800' :
                        t.status.toLowerCase().includes('progress') ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800'
                    }">${t.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
            
            // Add chatbot
            renderChatbot();
            
            console.log('Render complete!');
        }

        function renderChatbot() {
            const existing = document.querySelector('.fixed.bottom-6');
            if (existing) existing.remove();
            
            const chatDiv = document.createElement('div');
            chatDiv.className = 'fixed bottom-6 right-6 z-50';
            
            if (showChat) {
                chatDiv.innerHTML = `
                    <div class="bg-white rounded-lg shadow-2xl w-96 h-96 flex flex-col">
                        <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-t-lg flex justify-between">
                            <div><h3 class="font-semibold">AI Assistant</h3><p class="text-xs">Ask anything</p></div>
                            <button onclick="toggleChat()" class="hover:bg-white/20 rounded p-1">✕</button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-4 bg-gray-50" id="chatMsgs">
                            ${chatHistory.length === 0 ? '<p class="text-center text-gray-500 mt-8">👋 Ask me!</p>' :
                            chatHistory.map(m => `<div class="flex ${m.role==='user'?'justify-end':'justify-start'} mb-3">
                                <div class="${m.role==='user'?'bg-blue-600 text-white':'bg-white'} rounded-lg p-3 max-w-xs shadow text-sm whitespace-pre-wrap">${m.content}</div>
                            </div>`).join('')}
                        </div>
                        <div class="p-4 border-t">
                            <div class="flex gap-2">
                                <input id="chatInput" type="text" placeholder="Ask..." onkeypress="if(event.key==='Enter')sendChat()" 
                                    class="flex-1 px-4 py-2 border rounded-lg text-sm"/>
                                <button onclick="sendChat()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">➤</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                chatDiv.innerHTML = `
                    <button onclick="toggleChat()" class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-4 rounded-full shadow-lg">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
                        </svg>
                    </button>
                `;
            }
            
            document.body.appendChild(chatDiv);
        }
    </script>
</body>
</html>
